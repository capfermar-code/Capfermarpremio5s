<script>
// ═══ CONFIGURACAO — FERMAR ═══
// A chave "anon" abaixo e PUBLICA por natureza (fica no navegador de qualquer forma).
// Quem protege os dados e o RLS do Supabase (arquivo supabase_setup.sql).
// NUNCA coloque aqui a chave "service_role".
var SUPABASE_URL = "https://bnjnwbydoahhxfasebwl.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuam53Ynlkb2FoaHhmYXNlYndsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA1NDYyODEsImV4cCI6MjEwNjEyMjI4MX0.XohcAiQqd34tX8dlZGQ5EKo_exfeNZyqGbE4KCyuBM4";
var EMAIL_AUTORIZADO = "capfermar@gmail.com";   // unico usuario com acesso
var TABELA = "fermar_dados";
var MINUTOS_INATIVIDADE = 30;                   // sai sozinho apos X minutos parado

var _sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
  auth: {
    persistSession: true,
    storage: window.sessionStorage,   // fechou a aba/navegador = precisa logar de novo
    autoRefreshToken: true,
    detectSessionInUrl: false
  }
});

function _chk(r){ if(r.error) throw new Error(r.error.message); return r.data; }
function emailOk(u){ return !!(u && u.email && u.email.toLowerCase() === EMAIL_AUTORIZADO); }

// Camada compativel com o codigo antigo: _db.collection(x).doc(id).get/set/delete
var _db = {
  collection: function(){
    return { doc: function(id){
      return {
        get: function(){
          return _sb.from(TABELA).select("conteudo").eq("id", id).maybeSingle().then(function(r){
            var d = _chk(r);
            return { exists: !!d, data: function(){ return d ? d.conteudo : undefined; } };
          });
        },
        set: function(obj){
          return _sb.from(TABELA).upsert({ id: id, conteudo: obj, atualizado: new Date().toISOString() }).then(_chk);
        },
        delete: function(){
          return _sb.from(TABELA).delete().eq("id", id).then(_chk);
        }
      };
    } };
  }
};

// Cada tabela em uma linha separada
var COLECOES = ["emp","oc","pr","idx","cc","oc5","motivos","sensos","motdem","motafas"];

window._fbLoad = function(){
  return _sb.from(TABELA).select("id,conteudo").in("id", COLECOES).then(function(r){
    var rows = _chk(r) || [], mapa = {};
    rows.forEach(function(x){ mapa[x.id] = x.conteudo; });
    COLECOES.forEach(function(col){
      window.DB[col] = (mapa[col] && mapa[col].dados) || [];
    });
    if(!window.DB.sensos || window.DB.sensos.length === 0){
      window.DB.sensos = window.initSensos();
    }
    if((!window.DB.motdem || window.DB.motdem.length === 0) && window.initMotDem){
      window.DB.motdem = window.initMotDem();
    }
    if((!window.DB.motafas || window.DB.motafas.length === 0) && window.initMotAfas){
      window.DB.motafas = window.initMotAfas();
    }
    window._dbLoaded = true;
  });
};

window._fbSave = function(){
  var agora = new Date().toISOString();
  var linhas = COLECOES.map(function(col){
    return { id: col, conteudo: { dados: window.DB[col] || [], updated: agora }, atualizado: agora };
  });
  return _sb.from(TABELA).upsert(linhas).then(_chk);
};

window._fbReady = true;
document.dispatchEvent(new Event("fb-ready"));
</script>

.aniv-tag.emp{background:#fde8e9;color:#B5000D}
.aniv-tag.vida{background:#e4f4ea;color:#1a7a4a}
.aniv-ft{padding:0 1.25rem 1.35rem;text-align:center}
.aniv-ft button{background:#B5000D;color:#fff;border:none;border-radius:10px;padding:.7rem 2.2rem;font-size:14px;font-weight:800;cursor:pointer}
.aniv-ft button:hover{background:#ED0010}

/* 5S chips */
.chip{display:inline-flex;align-items:center;gap:3px;background:#fde8e9;color:var(--deep);border-radius:5px;padding:2px 3px 2px 8px;font-size:11px;font-weight:700}
.chip button{background:none;border:none;color:#a36d70;font-size:13px;line-height:1;padding:0 2px;border-radius:3px}
.chip button:hover{color:#c0392b;background:#fff}
.chip.add{background:#e4f4ea;color:#1a7a4a}
@media (max-width:900px){#main{padding:1rem}}
/* ===== Logo Fermar ===== */
.lg-plate{background:#fff;border-radius:12px;padding:14px 18px;box-shadow:0 10px 40px rgba(0,0,0,.35)}
#loading-screen .lg-load{width:260px;max-width:70vw;height:auto;display:block}
.lg-login{width:240px;max-width:100%;height:auto;display:block;margin:0 auto}
.lg-card{background:linear-gradient(var(--blue),var(--blue)) top/100% 5px no-repeat,#fff}
#sb .sb-hd{background:#fff;border-bottom:3px solid var(--blue);min-height:0;padding:.7rem .6rem .6rem .75rem}
#sb .sb-icon{width:34px;height:34px;display:none;object-fit:contain}
#sb .sb-word{width:150px;height:auto;display:block}
#sb .sb-app{color:#6b6264;font-weight:600}
#sb .sb-tog{color:#9a9092}
#sb .sb-tog:hover{color:var(--blue)}
#sb.col .sb-icon{display:block}
#lgw::after{background:linear-gradient(90deg,var(--deep),var(--blue))}
.h1,.mdl-tt{color:var(--ink)}
.nb.on{background:rgba(237,0,16,.16)}
</style>
</head>

  <div class="spin" id="sync-spin"></div>
  <span id="sync-msg">Salvando...</span>
</div>

<script>
// ═══════════════════════════════════════
// DB GLOBAL
// ═══════════════════════════════════════
var DB={emp:[],oc:[],pr:[],idx:[],cc:[],oc5:[],motivos:[],sensos:[],motdem:[],motafas:[]};
var SAVE_TIMER=null;

function dbLoad(){
  return window._fbLoad();
}

function dbSave(){
  if(!window._dbLoaded){
    showSync("Os dados nao foram carregados do servidor. Recarregue a pagina antes de salvar.",false,true);
    return;
  }
  clearTimeout(SAVE_TIMER);
  showSync("Salvando...",false);
  SAVE_TIMER=setTimeout(function(){
    if(!window._fbSave){
      showSync("Servidor nao carregado!",false,true);
      return;
    }
    window._fbSave().then(function(){
      var t=new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
      showSync("Salvo "+t,true);
      setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3000);
    }).catch(function(e){
      showSync("Erro: "+e.message,false,true);
    });
  },600);
}

function showSync(msg,ok,err){
  var bar=document.getElementById("sync-bar");
  var spin=document.getElementById("sync-spin");
  var txt=document.getElementById("sync-msg");
  bar.style.display="flex";
  bar.className="sync-bar"+(ok?" ok":err?" err":"");
  spin.style.display=(ok||err)?"none":"inline-block";
  txt.textContent=msg;
}

// ═══════════════════════════════════════
// LOGIN
// ═══════════════════════════════════════
function toggleSenha(){
  var inp=document.getElementById("lp");
  var icon=document.getElementById("eye-icon");
  if(inp.type==="password"){
    inp.type="text";
    icon.className="ti ti-eye-off";
  }else{
    inp.type="password";
    icon.className="ti ti-eye";
  }
}
var _loginOcupado=false;
function doLogin(){
  if(_loginOcupado)return;
  var u=document.getElementById("lu").value.trim().toLowerCase();
  var p=document.getElementById("lp").value;
  var err=document.getElementById("lerr");
  var btn=document.getElementById("btn-login");
  err.style.display="none";
  function falha(msg){err.textContent=msg;err.style.display="block";}
  if(!u||!p){falha("Informe e-mail e senha.");return;}
  if(u!==EMAIL_AUTORIZADO){falha("E-mail ou senha incorretos");return;}
  _loginOcupado=true;btn.disabled=true;
  showSync("Entrando...",false);
  _sb.auth.signInWithPassword({email:u,password:p}).then(function(r){
    if(r.error)throw r.error;
    if(!emailOk(r.data&&r.data.user)){_sb.auth.signOut();throw new Error("sem-permissao");}
    document.getElementById("lp").value="";
    return entrarApp();
  }).catch(function(e){
    document.getElementById("sync-bar").style.display="none";
    var m=(e&&e.message||"").toLowerCase();
    falha(m.indexOf("rate")>=0||m.indexOf("too many")>=0?"Muitas tentativas. Aguarde alguns minutos.":
          m.indexOf("fetch")>=0||m.indexOf("network")>=0?"Sem conexão com o servidor.":
          m.indexOf("not confirmed")>=0?"E-mail ainda não confirmado no Supabase.":"E-mail ou senha incorretos");
  }).then(function(){_loginOcupado=false;btn.disabled=false;});
}
// Sai sozinho apos um tempo sem uso (protege computador compartilhado)
var _inatTimer=null;
function _resetInat(){
  if(!window._dbLoaded)return;
  clearTimeout(_inatTimer);
  _inatTimer=setTimeout(function(){
    doLogout();
    var err=document.getElementById("lerr");
    err.textContent="Sessão encerrada por inatividade. Entre novamente.";err.style.display="block";
  },MINUTOS_INATIVIDADE*60*1000);
}
["click","keydown","mousemove","touchstart","scroll"].forEach(function(ev){
  document.addEventListener(ev,_resetInat,{passive:true});
});
// Carrega os dados e abre o sistema
function entrarApp(){
  showSync("Carregando dados...",false);
  return window._fbLoad().then(function(){
    document.getElementById("loading-screen").style.display="none";
    document.getElementById("lgw").style.display="none";
    document.getElementById("app").style.display="flex";
    document.getElementById("lp").value="";
    showSync("Dados carregados",true);
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3000);
    go("dashboard");
    if(typeof checkAniversarios==="function")setTimeout(checkAniversarios,400);
    _resetInat();
    if(typeof autoBackup==="function")setTimeout(autoBackup,1500);
  }).catch(function(e){
    showSync("Erro ao carregar os dados. Verifique a conexão ou a permissão da conta.",false,true);
    _sb.auth.signOut().catch(function(){});
    document.getElementById("loading-screen").style.display="none";
    document.getElementById("lgw").style.display="flex";
  });
}
function doLogout(){
  _sb.auth.signOut().catch(function(){});
  clearTimeout(_inatTimer);clearTimeout(SAVE_TIMER);
  // limpa os dados da memoria ao sair
  window._dbLoaded=false;
  Object.keys(DB).forEach(function(k){DB[k]=[];});
  BKP_LISTA=null;
  if(typeof killCH==="function")killCH();
  document.querySelectorAll(".page").forEach(function(pgEl){pgEl.innerHTML="";});
  document.querySelectorAll(".mdl-bg.open,.aniv-bg").forEach(function(m){if(m.classList.contains("aniv-bg"))m.remove();else m.classList.remove("open");});
  document.getElementById("app").style.display="none";
  document.getElementById("lgw").style.display="flex";
  document.getElementById("lu").value="";
  document.getElementById("lp").value="";
  document.getElementById("lerr").style.display="none";
}
// Se a sessao expirar ou for encerrada em outra aba, fecha o sistema
_sb.auth.onAuthStateChange(function(ev){
  if(ev==="SIGNED_OUT"&&window._dbLoaded)doLogout();
});

// ═══════════════════════════════════════
// STARTUP — aguarda Supabase ficar pronto
// ═══════════════════════════════════════
function startApp(){
  var ls=document.getElementById("loading-screen");
  // Nenhum dado e lido antes do login
  _sb.auth.getSession().then(function(r){
    var s=r&&r.data&&r.data.session;
    if(s&&emailOk(s.user)){entrarApp();return;}
    if(s)_sb.auth.signOut();
    ls.style.display="none";document.getElementById("lgw").style.display="flex";
  }).catch(function(){
    ls.style.display="none";document.getElementById("lgw").style.display="flex";
  });
}
if(window._fbReady){
  startApp();
}else{
  document.addEventListener("fb-ready",startApp);
  setTimeout(function(){
    if(!window._fbReady){
      document.getElementById("load-msg").textContent="Erro de conexao. Verifique a internet.";
    }
  },10000);
}

</script>

var B="#B5000D",BL="#ED0010",INK="#231F20",STEEL="#161415",RED="#c0392b",GRN="#1a7a4a",GLD="#e6a817",PUR="#7b3fa0";
var MOS=["Jan","Fev","Mar","Abr","Mai","Jun","Jul","Ago","Set","Out","Nov","Dez"];
var TIPOS=[
  {k:"falta", lb:"Falta",  ic:"ti-calendar-x", co:RED, df:15},
  {k:"atraso",lb:"Atraso", ic:"ti-clock-x",    co:GLD, df:5}
];

// DB definido pelo Supabase acima

function gmk(dt){var d=new Date(dt+"T12:00:00");return d.getFullYear()+"-"+(""+(d.getMonth()+1)).padStart(2,"0");}
function hoje(){return new Date().toISOString().slice(0,10);}
function curMes(){return gmk(hoje());}
function uid(){return Date.now()+""+Math.random().toString(36).slice(2,6);}
function esc(s){return(s==null?"":""+s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");}
function fmtBRL(v){
  v=(typeof v==="number"&&!isNaN(v))?v:(parseFloat(v)||0);
  return "R$ "+v.toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtBRLInt(v){
  v=(typeof v==="number"&&!isNaN(v))?v:(parseFloat(v)||0);
  return "R$"+Math.round(v).toLocaleString("pt-BR");
}
function fmtM(m){var p=m.split("-");return MOS[parseInt(p[1])-1]+"/"+p[0];}
function ini(n){return n.split(" ").map(function(w){return w[0];}).slice(0,2).join("").toUpperCase();}
function tEmp(a,d){
  var i=new Date(a+"T12:00:00"),f=d?new Date(d+"T12:00:00"):new Date();
  var anos=(f-i)/(1000*60*60*24*365.25);
  if(anos<1){var m=Math.floor(anos*12);return m<=0?"< 1 mes":m+" mes"+(m>1?"es":"");}
  return anos.toFixed(1)+" anos";
}
function getPct(tipo,data){
  var at=DB.idx.filter(function(x){return x.tipo===tipo&&x.ini<=data&&(!x.fim||x.fim>=data);});
  if(at.length>0)return at[at.length-1].pct;
  return {falta:15,atraso:5,"5s":10}[tipo]||0;
}
function calcDesc(eid,mes,val){
  var ocs=DB.oc.filter(function(x){return x.eid===eid&&gmk(x.data)===mes;});
  var f=ocs.filter(function(x){return x.tipo==="falta";}).length;
  var a=ocs.filter(function(x){return x.tipo==="atraso";}).length;
  var s=ocs.filter(function(x){return x.tipo==="5s";}).length;
  var pct=0;ocs.forEach(function(x){pct+=getPct(x.tipo,x.data);});
  pct=Math.min(100,pct);
  return{f:f,a:a,s:s,pct:pct,desc:(pct/100)*val,rec:val*(1-pct/100)};
}
function getMeses(){
  var s={};s[curMes()]=1;DB.oc.forEach(function(o){s[gmk(o.data)]=1;});
  return Object.keys(s).sort().reverse();
}
function mSel(id,val){
  var ms=getMeses(),h="<select id="+JSON.stringify(id)+" style='padding:.4rem .75rem;border:1.5px solid #e3dfdf;border-radius:8px;font-size:13px;color:"+B+";font-weight:600;background:#fff;width:auto'>";
  ms.forEach(function(m){h+="<option value="+JSON.stringify(m)+(m===val?" selected":"")+">"+fmtM(m)+"</option>";});
  return h+"</select>";
}
function sCard(lb,val,col,ic,sub){
  return "<div style='background:#fff;border-radius:12px;padding:1rem 1.25rem;box-shadow:0 2px 8px rgba(0,0,0,.07);border-top:3px solid "+col+"'>"
    +"<div style='display:flex;justify-content:space-between;align-items:flex-start'>"
    +"<div><div style='font-size:11px;color:#888;font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px'>"+lb+"</div>"
    +"<div style='font-size:20px;font-weight:800;color:"+col+"'>"+esc(val)+"</div>"
    +(sub?"<div style='font-size:11px;color:#aaa;margin-top:2px'>"+esc(sub)+"</div>":"")+"</div>"
    +(ic?"<i class='ti "+ic+"' style='font-size:26px;color:"+col+";opacity:.15'></i>":"")
    +"</div></div>";
}


// ═══ STATUS DO COLABORADOR ═══
// Ativo: campo "ativo" (novo). Cadastros antigos sem o campo: ativo se nao tiver data de demissao.
function isAtivo(e){return e.ativo===undefined?!e.dem:e.ativo!==false;}
// Conta para o mes (premios/relatorios): ativo, ou saiu (demissao/inativacao) depois daquele mes.
function empNoMes(e,mes){
  if(isAtivo(e))return true;
  var c=e.dem||e.inat;
  return !!c&&gmk(c)>mes;
}
function fmtD(d){if(!d)return "";var p=d.split("-");return p.length===3?p[2]+"/"+p[1]+"/"+p[0]:d;}
function gv(id){var el=document.getElementById(id);return el?el.value:"";}

// ═══ AFASTAMENTO E DATAS COMEMORATIVAS ═══
function mmdd(d){return d&&d.length>=10?d.slice(5,10):"";} // "MM-DD"
function anosInt(dataRef,dataBase){ // anos inteiros completos de dataBase ate dataRef
  if(!dataBase)return 0;
  var b=new Date(dataBase+"T12:00:00"),r=new Date(dataRef+"T12:00:00");
  var a=r.getFullYear()-b.getFullYear();
  if(r.getMonth()<b.getMonth()||(r.getMonth()===b.getMonth()&&r.getDate()<b.getDate()))a--;
  return a;
}
// Colaborador afastado em uma data especifica (dentro de algum periodo de afastamento)
function afastadoEm(e,data){
  if(!e.afast||!e.afast.length)return null;
  for(var i=0;i<e.afast.length;i++){
    var af=e.afast[i];
    if(af.ini&&af.ini<=data&&(!af.fim||af.fim>=data))return af;
  }
  return null;
}
// Colaborador afastado durante o mes m ("YYYY-MM") - qualquer sobreposicao com o mes
function afastadoNoMes(e,m){
  if(!e.afast||!e.afast.length)return false;
  var ini=m+"-01",fim=fimMesStr(m);
  return e.afast.some(function(af){return af.ini&&af.ini<=fim&&(!af.fim||af.fim>=ini);});
}
// Colaborador visivel no sistema: nao esta afastado hoje (afastado some de todas as telas e relatorios, exceto Colaboradores)
function vis(e){return !!e&&!afastadoEm(e,hoje());}
function ativoVis(e){return isAtivo(e)&&vis(e);}
// Filtro de lancamentos: oculta ocorrencias de colaboradores afastados
function ocVisF(){var h={};DB.emp.forEach(function(e){if(!vis(e))h[e.id]=1;});return function(o){return !h[o.eid];};}
// Conta para premios/relatorios: dentro do vinculo E nao afastado no mes E nao afastado hoje
function contaNoMes(e,m){return empNoMes(e,m)&&!afastadoNoMes(e,m)&&vis(e);}


// ═══ DETALHE DOS GRAFICOS DO DASHBOARD (clique para ver e editar) ═══
var DRILL=null;
function lblSenso(o){var s=o.senso_id?DB.sensos.find(function(x){return x.id===o.senso_id;}):null;return s?s.nome:"Sem criterio";}
function lblMotivo(o){var m=o.motivo_id?DB.motivos.find(function(x){return x.id===o.motivo_id;}):null;return m?m.nome:"Sem motivo";}
function attachDrill(chart,tipo){
  if(!chart)return;
  var cv=chart.canvas;
  cv.title="Clique para ver e editar os lancamentos";
  cv.addEventListener("click",function(ev){
    var els=chart.getElementsAtEventForMode(ev,"nearest",{intersect:true},true);
    if(!els.length)return;
    openDrill(tipo,chart.data.labels[els[0].index]);
  });
  cv.addEventListener("mousemove",function(ev){
    var els=chart.getElementsAtEventForMode(ev,"nearest",{intersect:true},false);
    cv.style.cursor=els.length?"pointer":"default";
  });
}
function drillItens(d){
  var noP=window._dashNoPeriodo||function(){return true;};
  var ocV=ocVisF();
  if(d.mes){
    // Grafico Faltas e Atrasos por Mes: mesmos colaboradores contados no grafico (premio cadastrado, no vinculo, nao afastado)
    return DB.oc.filter(function(o){
      if(o.tipo!==d.tipo||gmk(o.data)!==d.mes)return false;
      var e=DB.emp.find(function(x){return x.id===o.eid;});
      return !!e&&contaNoMes(e,d.mes)&&DB.pr.some(function(p){return p.eid===e.id;});
    }).sort(function(a,b){
      var ea=DB.emp.find(function(x){return x.id===a.eid;}),eb=DB.emp.find(function(x){return x.id===b.eid;});
      return (ea?ea.nome:"").localeCompare(eb?eb.nome:"")||b.data.localeCompare(a.data);
    });
  }
  if(d.tipo==="5s")return DB.oc5.filter(function(o){return noP(o.data)&&lblSenso(o)===d.label;}).sort(function(a,b){return b.data.localeCompare(a.data);});

// ═══ CORES DEGRADE PARA GRAFICOS ═══
function shade(hex,p){
  var h=hex.replace("#","");if(h.length===3)h=h.split("").map(function(c){return c+c;}).join("");
  var n=parseInt(h,16),r=n>>16,g=(n>>8)&255,b=n&255;
  function f(c){return Math.round(p<0?c*(1+p):c+(255-c)*p);}
  return "rgb("+f(r)+","+f(g)+","+f(b)+")";
}
// Degrade vertical (barras): mais claro na base, cor cheia no topo
function vGrad(c){
  return function(ctx){
    var ch=ctx.chart,a=ch.chartArea;if(!a)return c;
    var g=ch.ctx.createLinearGradient(0,a.bottom,0,a.top);
    g.addColorStop(0,shade(c,.55));g.addColorStop(.6,shade(c,.05));g.addColorStop(1,shade(c,-.18));
    return g;
  };
}
// Degrade por fatia (rosca/pizza)
function segGrad(colors){
  return function(ctx){
    var c=colors[ctx.dataIndex%colors.length]||"#888";
    var ch=ctx.chart,a=ch.chartArea;if(!a)return c;
    var g=ch.ctx.createLinearGradient(a.left,a.top,a.right,a.bottom);
    g.addColorStop(0,shade(c,.32));g.addColorStop(1,shade(c,-.22));
    return g;
  };
}

function rDash(){
  killCH();
  var selAno=document.getElementById("dash-ano")&&document.getElementById("dash-ano").value||String(new Date().getFullYear());
  var selMes=document.getElementById("dash-mes")&&document.getElementById("dash-mes").value||curMes();
  var modo=document.getElementById("dash-modo")&&document.getElementById("dash-modo").value||"mes"; // "mes" ou "ano"

  // Build year options
  var anos={};DB.oc.forEach(function(o){anos[gmk(o.data).split("-")[0]]=1;});DB.pr.forEach(function(p){});
  var anoAtual=String(new Date().getFullYear());anos[anoAtual]=1;
  var anoOpts=Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");

  // Testa se uma data cai dentro do periodo selecionado (mes especifico ou o ano inteiro)
  function noPeriodo(dataStr){
    return modo==="ano"?gmk(dataStr).split("-")[0]===selAno:gmk(dataStr)===selMes;
  }

  // Build annual data - usa apenas os meses que realmente possuem lancamentos (ocorrencias) no ano,
  // em vez de forcar Jan-Dez inteiro (que gerava valores de premio "fantasma" em meses sem nenhum uso do sistema)
  var mesesComDado={};
  DB.oc.forEach(function(o){var m=gmk(o.data);if(m.split("-")[0]===selAno)mesesComDado[m]=1;});
  if(selAno===String(new Date().getFullYear()))mesesComDado[curMes()]=1; // sempre inclui o mes atual, mesmo sem lancamentos
  var meses12=Object.keys(mesesComDado).sort();
  var lblAnual=meses12.map(function(m){return MOS[parseInt(m.split("-")[1],10)-1];});
  var aPago=[],aPerd=[],aFaltas=[],aAtrasos=[];
  meses12.forEach(function(mes){
    var p2=0,l2=0,f2=0,a2=0;
    DB.emp.forEach(function(e){
      if(!contaNoMes(e,mes))return;
      var pr=DB.pr.find(function(x){return x.eid===e.id;});if(!pr)return;
      var d=calcDesc(e.id,mes,pr.val);p2+=d.rec;l2+=d.desc;f2+=d.f;a2+=d.a;
    });
    aPago.push(+p2.toFixed(2));aPerd.push(+l2.toFixed(2));aFaltas.push(f2);aAtrasos.push(a2);
  });

  // Stats para o periodo selecionado (mes ou ano acumulado)
  var tp=0,tl=0,tf=0,ta=0,ok=0;
  if(modo==="ano"){
    tp=aPago.reduce(function(a,b){return a+b;},0);
    tl=aPerd.reduce(function(a,b){return a+b;},0);
    tf=aFaltas.reduce(function(a,b){return a+b;},0);
    ta=aAtrasos.reduce(function(a,b){return a+b;},0);
    DB.emp.forEach(function(e){
      var p=DB.pr.find(function(x){return x.eid===e.id;});if(!p)return;
      var mesesEmp=meses12.filter(function(mes){return contaNoMes(e,mes);});
      if(mesesEmp.length===0)return;
      var perfeito=mesesEmp.every(function(mes){return calcDesc(e.id,mes,p.val).pct===0;});
      if(perfeito)ok++;
    });
  }else{
    DB.emp.forEach(function(e){
      if(!contaNoMes(e,selMes))return;
      var p=DB.pr.find(function(x){return x.eid===e.id;});if(!p)return;
      var d=calcDesc(e.id,selMes,p.val);
      tp+=d.rec;tl+=d.desc;tf+=d.f;ta+=d.a;if(d.pct===0)ok++;
    });
  }
  // Infracoes 5S = numero de lancamentos (eventos) no periodo, nao a quantidade de colaboradores afetados
  var ts=DB.oc5.filter(function(o){return noPeriodo(o.data);}).length;

      :"<div style='height:175px;position:relative'><canvas id='ch-amot'></canvas></div>")+"</div>"
    +"<div class='card' style='padding:.875rem'>"
    +"<div style='font-weight:700;font-size:13px;color:"+PUR+";margin-bottom:.5rem'><i class='ti ti-alert-triangle' style='margin-right:4px'></i>5S por Senso - "+ml+"<i class='ti ti-hand-click' title='Clique no grafico para ver e editar' style='float:right;color:#b0b8c1;font-size:15px'></i></div>"
    +(DB.oc5.filter(function(o){return noPeriodo(o.data);}).length===0
      ?"<div style='color:#aaa;text-align:center;padding:1rem;font-size:12px'>Sem infracoes 5S no periodo</div>"
      :"<div style='height:175px;position:relative'><canvas id='ch-smot'></canvas></div>")+"</div>"
    +"</div>"

    // RANKING FALTAS E ATRASOS
    +"<div class='g2' style='margin-top:1rem'>"
    +"<div class='card'>"
    +"<div style='font-weight:700;font-size:13px;color:"+RED+";margin-bottom:.75rem'><i class='ti ti-trophy' style='margin-right:4px'></i>Ranking de Faltas - "+ml+"</div>"
    +rankHTML(rankF,RED,"Sem faltas no periodo")
    +"</div>"
    +"<div class='card'>"
    +"<div style='font-weight:700;font-size:13px;color:"+GLD+";margin-bottom:.75rem'><i class='ti ti-trophy' style='margin-right:4px'></i>Ranking de Atrasos - "+ml+"</div>"
    +rankHTML(rankA,GLD,"Sem atrasos no periodo")
    +"</div>"
    +"</div>";

  // Annual paid chart (degrade + rotulos maiores)
  var hasDL=typeof ChartDataLabels!=="undefined";
  var dlPlugins=hasDL?[ChartDataLabels]:[];
  function barDL(money){
    return {display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},anchor:"end",align:"top",offset:3,
      color:function(ctx){return ctx.dataset.dlc||"#333";},font:{size:12.5,weight:800},
      formatter:function(v){return money?fmtBRLInt(v):v;}};
  }
  function barScales(money){
    return {y:{beginAtZero:true,grace:"12%",ticks:{precision:money?undefined:0,callback:money?function(v){return fmtBRLInt(v);}:undefined,font:{size:11},color:"#7a838c"},grid:{color:"#f2f1f1"},border:{display:false}},
            x:{ticks:{font:{size:12,weight:600},color:"#555"},grid:{display:false}}};
  }
  CH.anopago=new Chart(document.getElementById("ch-anopago"),{type:"bar",
    plugins:dlPlugins,
    data:{labels:lblAnual,datasets:[{label:"Total Pago (R$)",data:aPago,backgroundColor:vGrad(BL),hoverBackgroundColor:BL,dlc:B,borderRadius:6,borderSkipped:false,maxBarThickness:90}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:6}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return fmtBRL(ctx.raw);}}},datalabels:barDL(true)},
      scales:barScales(true)}});

  // Annual lost chart
  CH.anoperd=new Chart(document.getElementById("ch-anoperd"),{type:"bar",
    plugins:dlPlugins,
    data:{labels:lblAnual,datasets:[{label:"Total Perdido (R$)",data:aPerd,backgroundColor:vGrad(RED),hoverBackgroundColor:RED,dlc:RED,borderRadius:6,borderSkipped:false,maxBarThickness:90}]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:6}},
      plugins:{legend:{display:false},tooltip:{callbacks:{label:function(ctx){return fmtBRL(ctx.raw);}}},datalabels:barDL(true)},
      scales:barScales(true)}});

  // Annual Faltas/Atrasos chart
  CH.anofa=new Chart(document.getElementById("ch-anofa"),{type:"bar",
    plugins:dlPlugins,
    data:{labels:lblAnual,datasets:[
      {label:"Faltas",data:aFaltas,backgroundColor:vGrad(RED),hoverBackgroundColor:RED,dlc:RED,borderRadius:6,borderSkipped:false,maxBarThickness:90},
      {label:"Atrasos",data:aAtrasos,backgroundColor:vGrad(GLD),hoverBackgroundColor:GLD,dlc:"#b8820a",borderRadius:6,borderSkipped:false,maxBarThickness:90}
    ]},
    options:{responsive:true,maintainAspectRatio:false,layout:{padding:{top:6}},
      plugins:{legend:{position:"top",labels:{boxWidth:12,font:{size:12},padding:10,
          generateLabels:function(chart){return chart.data.datasets.map(function(ds,i){return{text:ds.label,fillStyle:ds.hoverBackgroundColor,strokeStyle:ds.hoverBackgroundColor,lineWidth:0,hidden:!chart.isDatasetVisible(i),datasetIndex:i};});}}},
        tooltip:{callbacks:{label:function(ctx){return ctx.dataset.label+": "+ctx.raw;}}},
        datalabels:barDL(false)},
      scales:barScales(false)}});

  // Motivo pie helper
  function mkBreakdown(ocs,getLabel,getColor){
    var map={};
    ocs.forEach(function(o){var lb=getLabel(o);map[lb]=(map[lb]||0)+1;});
    var lbs=Object.keys(map),vals=lbs.map(function(k){return map[k];});
    var cols=lbs.map(function(lb,i){return getColor(lb,i);});
    return{labels:lbs,values:vals,colors:cols};
  }
  function mkPieFromBreakdown(cid,bd){
    if(bd.labels.length===0||!document.getElementById(cid))return null;
    return new Chart(document.getElementById(cid),{type:"doughnut",
      plugins:dlPlugins,
      data:{labels:bd.labels,datasets:[{data:bd.values,backgroundColor:segGrad(bd.colors),hoverBackgroundColor:bd.colors,borderWidth:2,borderColor:"#fff",hoverOffset:6}]},
      options:{responsive:true,maintainAspectRatio:false,cutout:"52%",layout:{padding:4},
        plugins:{legend:{position:"bottom",labels:{boxWidth:10,font:{size:11},padding:6,
          generateLabels:function(chart){var l=Chart.overrides.doughnut.plugins.legend.labels.generateLabels(chart);l.forEach(function(it,i){it.fillStyle=bd.colors[i%bd.colors.length];});return l;}}},
        tooltip:{callbacks:{label:function(ctx){return ctx.label+": "+ctx.raw;}}},
        datalabels:{color:"#fff",font:{size:13,weight:800},textStrokeColor:"rgba(0,0,0,.25)",textStrokeWidth:2,formatter:function(v){return v;}}}}});
  }
  var RPAL=["#c0392b","#e74c3c","#ff6b6b","#fab1a0","#d63031","#b71c1c"];
  var GPAL=["#e6a817","#f39c12","#fdcb6e","#e17055","#d4a017","#ff9f43"];
  var fOcs=DB.oc.filter(function(o){return o.tipo==="falta"&&noPeriodo(o.data)&&ocV(o);});
  var aOcs=DB.oc.filter(function(o){return o.tipo==="atraso"&&noPeriodo(o.data)&&ocV(o);});
  // 5S: usa os lancamentos (eventos) e nao os registros por colaborador, para nao inflar a contagem
  var sEvts=DB.oc5.filter(function(o){return noPeriodo(o.data);});
  var motivoLabel=function(o){var m=o.motivo_id?DB.motivos.find(function(x){return x.id===o.motivo_id;}):null;return m?m.nome:"Sem motivo";};
  var bdFaltas=mkBreakdown(fOcs,motivoLabel,function(lb,i){return RPAL[i%RPAL.length];});
  var bdAtrasos=mkBreakdown(aOcs,motivoLabel,function(lb,i){return GPAL[i%GPAL.length];});
  var bd5S=mkBreakdown(sEvts,
    function(o){var s=o.senso_id?DB.sensos.find(function(x){return x.id===o.senso_id;}):null;return s?s.nome:"Sem criterio";},
    function(lb){var s=DB.sensos.find(function(x){return x.nome===lb;});return(s&&s.cor)?s.cor:"#7b3fa0";}
  );
  CH.fmot=mkPieFromBreakdown("ch-fmot",bdFaltas);
  CH.amot=mkPieFromBreakdown("ch-amot",bdAtrasos);
  CH.smot=mkPieFromBreakdown("ch-smot",bd5S);
  attachDrill(CH.fmot,"falta");attachDrill(CH.amot,"atraso");attachDrill(CH.smot,"5s");
  attachDrillMes(CH.anofa,meses12);
  window._dashNoPeriodo=noPeriodo;window._dashML=ml;

  // Guarda os dados ja calculados para o gerador de Relatorio PDF reaproveitar (inclui dados brutos dos graficos)
  window._dashStats={selAno:selAno,selMes:selMes,modo:modo,ml:ml,sufixo:sufixo,tp:tp,tl:tl,tf:tf,ta:ta,ts:ts,ok:ok,rankF:rankF,rankA:rankA,
    lblAnual:lblAnual,aPago:aPago,aPerd:aPerd,aFaltas:aFaltas,aAtrasos:aAtrasos,
    motFaltas:bdFaltas,motAtrasos:bdAtrasos,sensos5S:bd5S};
}
function setDashModo(m){
  var el=document.getElementById("dash-modo");if(el)el.value=m;
  rDash();
}

// ═══════════════════════════════════════
// RELATORIO PDF DO DASHBOARD (2 folhas A4)
// ═══════════════════════════════════════
function gerarRelatorioPDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("A biblioteca de PDF ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  if(typeof Chart==="undefined"){alert("A biblioteca de graficos ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  var st=window._dashStats;
  if(!st){alert("Abra o Dashboard antes de gerar o relatorio.");return;}
  var jsPDF=window.jspdf.jsPDF;
  var doc=new jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
  var pageW=297,pageH=210,mg=13,cw=pageW-mg*2;
  var rgbB=[181,0,13],rgbBL=[237,0,16],rgbINK=[22,20,21],rgbRED=[192,57,43],rgbGRN=[26,122,74],rgbGLD=[230,168,23],rgbPUR=[123,63,160],rgbLine=[232,228,228];
  var BANDH=25,PXSCALE=7;

  function rgba(rgb,a){return "rgba("+rgb[0]+","+rgb[1]+","+rgb[2]+","+(a===undefined?1:a)+")";}

  // ---- Elementos base reutilizaveis ----
  function panel(x,y,w,h){
    doc.setFillColor(255,255,255);
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.35);
    doc.roundedRect(x,y,w,h,2,2,"FD");
  }
  function header(titulo){
    doc.setFillColor(rgbINK[0],rgbINK[1],rgbINK[2]);
    doc.rect(0,0,pageW,BANDH,"F");
    doc.setFillColor(rgbBL[0],rgbBL[1],rgbBL[2]);
    doc.rect(0,BANDH,pageW,1.2,"F");
    if(window._logoPNG){
      doc.addImage(window._logoPNG,"PNG",mg,4.2,59.8,13);
      doc.setFont("helvetica","normal");doc.setFontSize(7.5);
      doc.setTextColor(200,208,218);
      doc.text("Gestao de Premios",mg+60.5+3,15.2);
    }else{
      doc.setFont("helvetica","bold");doc.setFontSize(15);
      doc.setTextColor(255,255,255);
      doc.text("FERMAR",mg,11);
      doc.setFont("helvetica","normal");doc.setFontSize(7.5);
      doc.setTextColor(200,208,218);
      doc.text("Metalurgica e Serralheria  -  Gestao de Premios",mg,16.5);
    }
    doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.setTextColor(255,255,255);
    doc.text(titulo,pageW-mg,10.5,{align:"right"});
    var agora=new Date();
    var dataStr=agora.toLocaleDateString("pt-BR")+" as "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
    doc.setFont("helvetica","normal");doc.setFontSize(8);
    doc.setTextColor(215,224,242);
    doc.text("Periodo: "+st.ml,pageW-mg,16,{align:"right"});
    doc.setFontSize(7);doc.setTextColor(180,195,225);
    doc.text("Gerado em "+dataStr,pageW-mg,20.5,{align:"right"});
    return BANDH+9;
  }
  function footer(pagNum){
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.3);
    doc.line(mg,pageH-10,pageW-mg,pageH-10);
    doc.setFont("helvetica","normal");doc.setFontSize(7.3);doc.setTextColor(165,165,165);
    doc.text("Fermar - Sistema de Gestao de Premios",mg,pageH-6);
    doc.text("Documento gerado automaticamente pelo sistema",pageW/2,pageH-6,{align:"center"});
    doc.text("Pagina "+pagNum+"/2",pageW-mg,pageH-6,{align:"right"});
  }
  function sectionLabel(txt,x,y,rgb){
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(x,y-3.2,2.2,2.2,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(10.5);
    doc.setTextColor(50,50,50);
    doc.text(txt,x+4.5,y);
  }
  function statCard(x,y,w,h,lb,val,rgb){
    panel(x,y,w,h);
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(x,y,w,1.1,"F");
    doc.setFont("helvetica","normal");doc.setFontSize(6.8);
    doc.setTextColor(130,130,130);
    doc.text(String(lb).toUpperCase(),x+3,y+7.5);
    doc.setFont("helvetica","bold");doc.setFontSize(12.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(String(val),x+3,y+15.5);
  }
  // Painel que recebe uma imagem de grafico JA renderizada no tamanho exato da area util (sem sobra/distorcao)
  function chartPanel(imgDataUrl,x,y,w,h,titulo,rgb){
    panel(x,y,w,h);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(titulo,x+4,y+6.5);
    doc.setDrawColor(rgbLine[0],rgbLine[1],rgbLine[2]);doc.setLineWidth(.25);
    doc.line(x+4,y+8.5,x+w-4,y+8.5);
    var areaX=x+4,areaY=y+11,areaW=w-8,areaH=h-14;
    if(!imgDataUrl){
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(190,190,190);
      doc.text("Sem dados no periodo",x+w/2,y+h/2,{align:"center"});
      return;
    }
    doc.addImage(imgDataUrl,"PNG",areaX,areaY,areaW,areaH);
  }
  function rankPanel(x,y,w,h,title,items,rgb,colLabel){
    panel(x,y,w,h);
    doc.setFont("helvetica","bold");doc.setFontSize(8.5);
    doc.setTextColor(rgb[0],rgb[1],rgb[2]);
    doc.text(title,x+4,y+6.5);
    var tx=x+4,tw=w-8,rowH=5.6,yy=y+9.5;
    doc.setFillColor(rgb[0],rgb[1],rgb[2]);
    doc.rect(tx,yy,tw,rowH,"F");
    doc.setFont("helvetica","bold");doc.setFontSize(7.3);doc.setTextColor(255,255,255);
    doc.text("#",tx+2.5,yy+3.8);
    doc.text("Colaborador",tx+9,yy+3.8);
    doc.text(colLabel,tx+tw-2.5,yy+3.8,{align:"right"});
    yy+=rowH;
    var maxRows=Math.max(1,Math.floor((h-(yy-y)-3)/rowH));
    var top=items.slice(0,Math.min(10,maxRows));
    if(top.length===0){
      doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(190,190,190);
      doc.text("Sem ocorrencias no periodo",tx+2.5,yy+4);
      return;
    }
    top.forEach(function(it,i){
      if(i%2===1){doc.setFillColor(248,250,255);doc.rect(tx,yy,tw,rowH,"F");}
      doc.setFont("helvetica","normal");doc.setFontSize(7.3);doc.setTextColor(70,70,70);
      doc.text(String(i+1),tx+2.5,yy+3.8);
      var nomeShort=it.nome.length>36?it.nome.slice(0,34)+"...":it.nome;
      doc.text(nomeShort,tx+9,yy+3.8);
      doc.setFont("helvetica","bold");doc.setTextColor(rgb[0],rgb[1],rgb[2]);
      doc.text(String(it.count),tx+tw-2.5,yy+3.8,{align:"right"});
      yy+=rowH;
    });
  }

  // ---- Geracao de graficos em canvas temporario (fora da tela), no tamanho EXATO da area do painel ----
  // Isso garante que a imagem preencha o quadrado inteiro, sem sobra branca nem distorcao.
  function tempCanvas(pxW,pxH){
    var cv=document.createElement("canvas");
    cv.width=pxW;cv.height=pxH;
    cv.style.position="fixed";cv.style.left="-99999px";cv.style.top="0";
    document.body.appendChild(cv);
    return cv;
  }
  var dlP=(typeof ChartDataLabels!=="undefined")?[ChartDataLabels]:[];
  function renderOffscreen(cfg,areaW,areaH){
    var pxW=Math.max(50,Math.round(areaW*PXSCALE)),pxH=Math.max(50,Math.round(areaH*PXSCALE));
    var cv=tempCanvas(pxW,pxH);
    var ch=new Chart(cv,cfg);
    var img=ch.toBase64Image();
    ch.destroy();cv.remove();
    return img;
  }
  function doughnutImg(bd,areaW,areaH){
    if(!bd||!bd.labels||bd.labels.length===0)return null;
    return renderOffscreen({type:"doughnut",plugins:dlP,
      data:{labels:bd.labels,datasets:[{data:bd.values,backgroundColor:bd.colors,borderWidth:2,borderColor:"#fff"}]},
      options:{responsive:false,animation:false,
        plugins:{legend:{position:"bottom",labels:{boxWidth:16,font:{size:15},padding:10}},
          datalabels:{color:"#fff",font:{size:15,weight:700},formatter:function(v){return v;}}}}
    },areaW,areaH);
  }
  function barImg(labels,datasets,areaW,areaH,money){
    if(!labels||labels.length===0)return null;
    return renderOffscreen({type:"bar",plugins:dlP,
      data:{labels:labels,datasets:datasets},
      options:{responsive:false,animation:false,
        plugins:{legend:{display:datasets.length>1,position:"top",labels:{boxWidth:14,font:{size:14},padding:8}},
          datalabels:{display:function(ctx){return ctx.dataset.data[ctx.dataIndex]>0;},anchor:"end",align:"top",
            color:function(ctx){return ctx.dataset.borderColor;},font:{size:12,weight:700},
            formatter:function(v){return money?fmtBRLInt(v):v;}}},
        scales:{y:{beginAtZero:true,ticks:{font:{size:13},precision:money?2:0,callback:money?function(v){return fmtBRLInt(v);}:undefined},grid:{color:"#f4f2f2"}},
                x:{ticks:{font:{size:13}},grid:{display:false}}}}
    },areaW,areaH);
  }

  // ===== PAGINA 1 - VISAO GERAL =====
  var tituloModo=st.modo==="ano"?"Relatorio Anual (Acumulado)":"Relatorio Mensal";
  var y=header(tituloModo);

  sectionLabel("Indicadores - "+st.ml,mg,y,rgbB);
  y+=4;
  var statsArr=[
    {lb:"Colaboradores ativos",val:String(DB.emp.filter(ativoVis).length),rgb:rgbB},
    {lb:"100% Premio "+st.sufixo,val:String(st.ok),rgb:rgbGRN},
    {lb:"Total Pago "+st.sufixo,val:fmtBRL(st.tp),rgb:rgbBL},
    {lb:"Total Perdido "+st.sufixo,val:fmtBRL(st.tl),rgb:rgbRED},
    {lb:"Faltas",val:String(st.tf),rgb:rgbRED},
    {lb:"Atrasos",val:String(st.ta),rgb:rgbGLD},
    {lb:"Infracoes 5S",val:String(st.ts),rgb:rgbPUR}
  ];
  var gap=3.5,cardW=(cw-6*gap)/7,cardH=20;
  statsArr.forEach(function(s,i){
    statCard(mg+i*(cardW+gap),y,cardW,cardH,s.lb,s.val,s.rgb);
  });
  y+=cardH+9;

  sectionLabel("Evolucao Anual - "+st.selAno,mg,y,rgbB);
  y+=4;
  var colW=(cw-2*gap)/3,chartH=Math.min(105,pageH-10-y-4);
  var areaW1=colW-8,areaH1=chartH-14;
  var imgPago=barImg(st.lblAnual,[{label:"Total Pago",data:st.aPago,backgroundColor:rgba(rgbGRN,.82),borderColor:rgba(rgbGRN,1),borderRadius:4}],areaW1,areaH1,true);
  var imgPerd=barImg(st.lblAnual,[{label:"Total Perdido",data:st.aPerd,backgroundColor:rgba(rgbRED,.82),borderColor:rgba(rgbRED,1),borderRadius:4}],areaW1,areaH1,true);
  var imgFA=barImg(st.lblAnual,[
    {label:"Faltas",data:st.aFaltas,backgroundColor:rgba(rgbRED,.82),borderColor:rgba(rgbRED,1),borderRadius:4},
    {label:"Atrasos",data:st.aAtrasos,backgroundColor:rgba(rgbGLD,.82),borderColor:rgba(rgbGLD,1),borderRadius:4}
  ],areaW1,areaH1,false);
  chartPanel(imgPago,mg,y,colW,chartH,"Total Pago por Mes",rgbGRN);
  chartPanel(imgPerd,mg+colW+gap,y,colW,chartH,"Total Perdido por Mes",rgbRED);
  chartPanel(imgFA,mg+2*(colW+gap),y,colW,chartH,"Faltas e Atrasos por Mes",rgbB);

  footer(1);

  // ===== PAGINA 2 - MOTIVOS E RANKINGS =====
  doc.addPage();
  y=header(tituloModo);

  sectionLabel("Motivos das Ocorrencias - "+st.ml,mg,y,rgbB);
  y+=4;
  var motH=72;
  var areaW2=colW-8,areaH2=motH-14;
  var imgFmot=doughnutImg(st.motFaltas,areaW2,areaH2);
  var imgAmot=doughnutImg(st.motAtrasos,areaW2,areaH2);
  var imgSmot=doughnutImg(st.sensos5S,areaW2,areaH2);
  chartPanel(imgFmot,mg,y,colW,motH,"Motivos de Faltas",rgbRED);
  chartPanel(imgAmot,mg+colW+gap,y,colW,motH,"Motivos de Atrasos",rgbGLD);
  chartPanel(imgSmot,mg+2*(colW+gap),y,colW,motH,"5S por Senso",rgbPUR);
  y+=motH+9;

  sectionLabel("Rankings - "+st.ml,mg,y,rgbB);
  y+=4;
  var rankW=(cw-gap)/2,rankH=Math.min(72,pageH-10-y-4);
  rankPanel(mg,y,rankW,rankH,"Ranking de Faltas",st.rankF,rgbRED,"Faltas");
  rankPanel(mg+rankW+gap,y,rankW,rankH,"Ranking de Atrasos",st.rankA,rgbGLD,"Atrasos");

  footer(2);

  doc.save("relatorio-dashboard-"+(st.modo==="ano"?st.selAno:st.selMes)+".pdf");
}

function empListaFiltrada(q){
  q=(q||"").toLowerCase();
  return DB.emp.filter(function(e){
    var a=isAtivo(e);
    if(empFiltro==="ativos"&&!(a&&vis(e)))return false;
    if(empFiltro==="afastados"&&!(a&&!vis(e)))return false;
    if(empFiltro==="inativos"&&a)return false;
    return !q||e.nome.toLowerCase().includes(q)||(e.func||"").toLowerCase().includes(q)||empVinc(e).toLowerCase()===q;
  }).sort(function(a,b){return a.nome.localeCompare(b.nome);});
}

function savEmp(){
  var id=gv("eid");
  var nome=gv("enome").trim(),func=gv("efunc").trim(),ccid=gv("ecc"),adm=gv("eadm"),aniv=gv("eaniv");
  var salTx=gv("esal").trim(),sal=salTx===""?null:parseFloat(salTx.replace(",","."));
  if(sal!==null&&(isNaN(sal)||sal<0)){alert("Informe um salario valido.");return;}
  var ativo=gv("eativo")==="1",vinc=gv("evinc")==="MEI"?"MEI":"CLT";
  if(!nome||!func||!adm){alert("Preencha nome, funcao e admissao.");return;}
  var old=id?DB.emp.find(function(e){return e.id===id;}):null;
  if(old&&old.dem&&ativo&&!confirm(nome+" esta demitido. Marcar como ativo cancela a demissao. Continuar?"))return;
  var obj=Object.assign({},old||{dem:""},{id:id||uid(),nome:nome,func:func,ccid:ccid,adm:adm,aniv:aniv,ativo:ativo,vinc:vinc});
  if(sal===null)delete obj.sal;else obj.sal=+sal.toFixed(2);
  if(ativo){obj.dem="";delete obj.motdem;delete obj.obsdem;delete obj.inat;}
  else if(!obj.dem&&!obj.inat){obj.inat=hoje();}
  if(obj.dem&&adm>obj.dem){alert("A admissao nao pode ser posterior a demissao ("+fmtD(obj.dem)+").");return;}
  if(id){DB.emp=DB.emp.map(function(e){return e.id===id?obj:e;});}else{DB.emp.push(obj);}
  dbSave();rEmp();
}

  var an=document.getElementById("eaniv");if(an)an.value=e.aniv||"";
  var sl=document.getElementById("esal");if(sl)sl.value=(e.sal!==undefined&&e.sal!==null)?e.sal:"";

  openMd("md-emp");
}

function addMotDem(){
  var nm=gv("dmnovonm").trim();
  if(!nm){alert("Informe o nome do motivo.");return;}
  var ex=DB.motdem.find(function(m){return m.nome.toLowerCase()===nm.toLowerCase();});
  var novo=ex||{id:uid(),nome:nm};
  if(!ex){DB.motdem.push(novo);dbSave();}
  var sel=document.getElementById("dmmot");if(sel)sel.innerHTML=motDemOpts(novo.id);
  document.getElementById("dmnovonm").value="";
  document.getElementById("dmnovo").style.display="none";
}
function confDem(){
  var id=gv("dmid"),data=gv("dmdata"),mot=gv("dmmot"),obs=gv("dmobs").trim();
  var e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  if(!data){alert("Informe a data da demissao.");return;}
  if(e.adm&&data<e.adm){alert("A demissao nao pode ser anterior a admissao ("+fmtD(e.adm)+").");return;}
  if(!mot){alert("Selecione o motivo da saida (ou cadastre um novo).");return;}
  DB.emp=DB.emp.map(function(x){
    if(x.id!==id)return x;

  }

function renderAfastArea(e){

  var lista=afs.map(function(af){

    var fut=af.ini&&af.ini>hoj;

      +"<div style='font-size:12px;min-width:0'><b style='color:#333'>"+esc(motAfasNome(af.mot))+"</b> "+badge+"<br/>"
      +"<span style='color:#888'>"+fmtD(af.ini)+" &rarr; "+(af.fim?fmtD(af.fim):"sem data de retorno")+"</span>"
      +(af.obs?"<br/><span style='color:#aaa'>"+esc(af.obs)+"</span>":"")+"</div>"
      +"<button class='ibdel' title='Remover afastamento' onclick=\"delAfast('"+e.id+"','"+af.id+"')\"><i class='ti ti-trash'></i></button>"
      +"</div>";

    +"<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px'>"

function closeAfastModal(){var m=document.getElementById("md-afast");if(m)m.remove();}
function togNovoMotAfas(){
  var r=document.getElementById("afnovo");if(!r)return;
  var show=r.style.display==="none";
  r.style.display=show?"flex":"none";
  if(show)document.getElementById("afnovonm").focus();
}
function addMotAfas(){
  var nm=gv("afnovonm").trim();
  if(!nm){alert("Informe o nome do motivo.");return;}
  if(!DB.motafas)DB.motafas=[];
  var ex=DB.motafas.find(function(m){return m.nome.toLowerCase()===nm.toLowerCase();});
  var novo=ex||{id:uid(),nome:nm};
  if(!ex){DB.motafas.push(novo);dbSave();}
  var sel=document.getElementById("afmot");if(sel)sel.innerHTML=motAfasOpts(novo.id);
  document.getElementById("afnovonm").value="";
  document.getElementById("afnovo").style.display="none";
}
function confAfast(){
  var id=gv("afid"),mot=gv("afmot"),ini=gv("afini"),fim=gv("affim"),obs=gv("afobs").trim();
  var e=DB.emp.find(function(x){return x.id===id;});if(!e)return;
  if(!mot){alert("Selecione o motivo do afastamento (ou cadastre um novo).");return;}
  if(!ini){alert("Informe a data de inicio do afastamento.");return;}
  if(e.adm&&ini<e.adm){alert("O afastamento nao pode comecar antes da admissao ("+fmtD(e.adm)+").");return;}
  if(fim&&fim<ini){alert("A data de fim nao pode ser anterior ao inicio.");return;}
  DB.emp=DB.emp.map(function(x){
    if(x.id!==id)return x;
    var n=Object.assign({},x);n.afast=(n.afast||[]).concat([{id:uid(),mot:mot,ini:ini,fim:fim||"",obs:obs}]);return n;
  });
  dbSave();closeAfastModal();
  var e2=DB.emp.find(function(x){return x.id===id;});
  var area=document.getElementById("edemarea");if(area&&gv("eid")===id)area.innerHTML=empExtraArea(e2);
  if(pg==="employees")rEmp();
}
function delAfast(eid,afid){
  var e=DB.emp.find(function(x){return x.id===eid;});if(!e)return;
  if(!confirm("Remover este afastamento?"))return;
  DB.emp=DB.emp.map(function(x){
    if(x.id!==eid)return x;
    var n=Object.assign({},x);n.afast=(n.afast||[]).filter(function(a){return a.id!==afid;});return n;
  });
  dbSave();
  var e2=DB.emp.find(function(x){return x.id===eid;});
  var area=document.getElementById("edemarea");if(area&&gv("eid")===eid)area.innerHTML=empExtraArea(e2);
  if(pg==="employees")rEmp();
}

function savMotDemPg(){
  var nm=gv("mdnome").trim();if(!nm){alert("Informe o nome do motivo.");return;}
  if(DB.motdem.find(function(m){return m.nome.toLowerCase()===nm.toLowerCase();})){alert("Esse motivo ja existe.");return;}
  DB.motdem.push({id:uid(),nome:nm});dbSave();rMotivos();
}
function delMotDem(id){
  var cnt=DB.emp.filter(function(e){return e.motdem===id;}).length;
  if(!confirm(cnt?"Este motivo esta em "+cnt+" demissao(oes). Remover mesmo assim? (elas ficarao como Sem motivo)":"Remover este motivo?"))return;
  DB.motdem=DB.motdem.filter(function(m){return m.id!==id;});dbSave();rMotivos();
}
var motTipoSel="falta";
function setMotTipo(t){
  motTipoSel=t;
  var el=document.getElementById("mot-tipo-sel");if(el)el.value=t;
  var bf=document.getElementById("motbf"),ba=document.getElementById("motba");
  if(bf){if(t==="falta"){bf.style.borderColor=RED;bf.style.background=RED+"18";bf.style.color=RED;}else{bf.style.borderColor="#e3dfdf";bf.style.background="#fff";bf.style.color="#777";}}
  if(ba){if(t==="atraso"){ba.style.borderColor=GLD;ba.style.background=GLD+"18";ba.style.color=GLD;}else{ba.style.borderColor="#e3dfdf";ba.style.background="#fff";ba.style.color="#777";}}
  // Update motivo list select
  var sel=document.getElementById("mot-tipo");if(sel)sel.value=t;
}
function savMot(){
  var id=document.getElementById("mot-id").value;
  var tipo=document.getElementById("mot-tipo-sel").value;
  var nome=document.getElementById("mot-nome").value.trim();
  var desc=document.getElementById("mot-desc").value.trim();
  if(!nome){alert("Informe o nome do motivo.");return;}
  var obj={id:id||uid(),tipo:tipo,nome:nome,desc:desc};
  if(id){DB.motivos=DB.motivos.map(function(x){return x.id===id?obj:x;});}else{DB.motivos.push(obj);}
  dbSave();canMot();rMotivos();
}
function edtMot(id){
  var m=DB.motivos.find(function(x){return x.id===id;});if(!m)return;
  document.getElementById("mot-id").value=id;
  document.getElementById("mot-nome").value=m.nome;
  document.getElementById("mot-desc").value=m.desc||"";
  document.getElementById("mot-ft").textContent="Editar motivo";
  document.getElementById("mot-cb").style.display="";
  document.querySelector("#p-motivos .btnp").textContent="Salvar alteracoes";
  setMotTipo(m.tipo);
}
function canMot(){
  ["mot-id","mot-nome","mot-desc"].forEach(function(id){var el=document.getElementById(id);if(el)el.value="";});
  document.getElementById("mot-ft").textContent="Novo motivo";
  document.getElementById("mot-cb").style.display="none";
  var btn=document.querySelector("#p-motivos .btnp");if(btn)btn.textContent="Cadastrar";
}
function delMot(id){
  if(!confirm("Remover este motivo?"))return;
  DB.motivos=DB.motivos.filter(function(x){return x.id!==id;});
  dbSave();rMotivos();
}
function savSen(){

function s5Base(){

function s5Reset(){s5Sel=s5Base();upd5SPreview();}
function s5Rem(id){s5Sel=s5Sel.filter(function(x){return x!==id;});upd5SPreview();}
function s5Add(id){if(id&&s5Sel.indexOf(id)<0)s5Sel.push(id);upd5SPreview();}
function setModo5S(m){
  s5Modo=m;
  var el=document.getElementById("s5modo");if(el)el.value=m;
  var bgeral=document.getElementById("s5mgeral"),bcc=document.getElementById("s5mcc");
  var ccrow=document.getElementById("s5ccrow");
  if(m==="geral"){
    if(bgeral){bgeral.style.borderColor=RED;bgeral.style.background=RED+"18";bgeral.style.color=RED;}
    if(bcc){bcc.style.borderColor="#e3dfdf";bcc.style.background="#fff";bcc.style.color="#777";}
    if(ccrow)ccrow.style.display="none";
  }else{
    if(bcc){bcc.style.borderColor=BL;bcc.style.background=BL+"18";bcc.style.color=BL;}
    if(bgeral){bgeral.style.borderColor="#e3dfdf";bgeral.style.background="#fff";bgeral.style.color="#777";}
    if(ccrow)ccrow.style.display="";

function upd5SPreview(){
  var pl=document.getElementById("s5prevlist");if(!pl)return;
  var modo=gv("s5modo")||"geral",ccid=gv("s5cc");
  var base=s5Base();
  var emps=s5Sel.map(function(id){return DB.emp.find(function(e){return e.id===id;});}).filter(Boolean)
    .sort(function(a,b){return a.nome.localeCompare(b.nome);});
  var alterado=base.length!==s5Sel.length||base.some(function(id){return s5Sel.indexOf(id)<0;});
  var rb=document.getElementById("s5restore");if(rb)rb.style.display=alterado?"":"none";
  if(emps.length===0){
    pl.innerHTML="<span style='color:#aaa'>Nenhum colaborador"+(modo==="cc"&&!ccid?" (selecione um centro ou adicione abaixo)":"")+"</span>";
  }else{
    pl.innerHTML="<strong style='color:"+B+"'>"+emps.length+"</strong> colaborador"+(emps.length!==1?"es":"")+" afetado"+(emps.length!==1?"s":"")
      +" <span style='color:#9aa3ad'>&middot; clique no x para excluir</span>"
      +"<div style='display:flex;flex-wrap:wrap;gap:4px;margin-top:6px'>"
      +emps.map(function(e){
        var extra=base.indexOf(e.id)<0;
        return "<span class='chip"+(extra?" add":"")+"' title='"+esc(e.nome)+(extra?" (adicionado manualmente)":"")+"'>"+esc(nome1(e))
          +"<button type='button' onclick=\"s5Rem('"+e.id+"')\" aria-label='Excluir "+esc(e.nome)+"'><i class='ti ti-x'></i></button></span>";
      }).join("")
      +"</div>";
  }
  var add=document.getElementById("s5add");
  if(add){
    var fora=DB.emp.filter(function(e){return ativoVis(e)&&s5Sel.indexOf(e.id)<0;}).sort(function(a,b){return a.nome.localeCompare(b.nome);});
    add.innerHTML="<option value=''>+ Adicionar colaborador"+(fora.length?" ("+fora.length+" disponive"+(fora.length!==1?"is":"l")+")":"")+"</option>"
      +fora.map(function(e){var c=DB.cc.find(function(x){return x.id===e.ccid;});return "<option value='"+e.id+"'>"+esc(e.nome)+(c?" - "+esc(c.cod):"")+"</option>";}).join("");
    add.disabled=fora.length===0;
  }
}
function sav5S(){
  var id=gv("s5id");
  var modo=gv("s5modo");
  var ccid=gv("s5cc");
  var data=gv("s5data");
  var obs=gv("s5obs").trim();
  if(!data){alert("Informe a data.");return;}
  if(modo==="cc"&&!ccid){alert("Selecione o centro de custo.");return;}
  var emps=s5Sel.map(function(x){return DB.emp.find(function(e){return e.id===x;});}).filter(Boolean);
  if(emps.length===0){alert("Nenhum colaborador afetado. Adicione ao menos um colaborador.");return;}
  var s5senso=gv("s5senso");
  var obj={id:id||uid(),modo:modo,ccid:modo==="cc"?ccid:"",data:data,obs:obs,senso_id:s5senso,eids:emps.map(function(e){return e.id;})};
  if(id){
    DB.oc5=DB.oc5.map(function(x){return x.id===id?obj:x;});
    DB.oc=DB.oc.filter(function(o){return o.s5ref!==id;});
  }else{
    DB.oc5.push(obj);
  }
  emps.forEach(function(e){
    DB.oc.push({id:uid(),eid:e.id,tipo:"5s",data:data,obs:obs,s5ref:obj.id,senso_id:s5senso});
  });
  dbSave();r5S();
  if(pg==="dashboard"){rDash();reopenDrill();}
}
function edt5S(id){
  var o=DB.oc5.find(function(x){return x.id===id;});if(!o)return;
  can5S();
  document.getElementById("s5id").value=id;
  document.getElementById("s5data").value=o.data;
  document.getElementById("s5obs").value=o.obs||"";
  var ss=document.getElementById("s5senso");if(ss)ss.value=o.senso_id||"";
  document.getElementById("s5ft").textContent="Editar infracao 5S";
  document.getElementById("s5sav").textContent="Salvar alteracoes";
  if(o.modo==="cc"){var cc=document.getElementById("s5cc");if(cc)cc.value=o.ccid||"";}
  setModo5S(o.modo);
  // lista salva (inclui ajustes manuais); registros antigos: colaboradores que receberam o desconto
  s5Sel=s5Afetados(o).map(function(e){return e.id;});
  upd5SPreview();
  openMd("md-5s");
}
function can5S(){
  var i=document.getElementById("s5id");if(!i)return;
  i.value="";
  document.getElementById("s5data").value=hoje();
  document.getElementById("s5obs").value="";
  var ss=document.getElementById("s5senso");if(ss)ss.value="";
  var cc=document.getElementById("s5cc");if(cc)cc.value="";
  document.getElementById("s5ft").textContent="Nova infracao 5S";
  document.getElementById("s5sav").textContent="Lancar Infracao 5S";
  setModo5S("geral");
  closeMd("md-5s");
}
function del5S(id){
  if(!confirm("Remover esta infracao 5S e todos os descontos vinculados?"))return;
  DB.oc5=DB.oc5.filter(function(x){return x.id!==id;});
  DB.oc=DB.oc.filter(function(o){return o.s5ref!==id;});
  dbSave();r5S();
  if(pg==="dashboard"){rDash();reopenDrill();}
}

  var id=gv("ixid"),tipo=gv("ixtipo");

  if(!tipo||isNaN(pct)||pct<=0||pct>100||!ini2){alert("Preencha tipo, % (1 a 100) e inicio da vigencia.");return;}
  if(fim&&fim<ini2){alert("Fim nao pode ser anterior ao inicio.");return;}
  var obj={id:id||uid(),tipo:tipo,pct:pct,ini:ini2,fim:fim,obs:obs};
  if(id){DB.idx=DB.idx.map(function(x){return x.id===id?obj:x;});}else{DB.idx.push(obj);}
  dbSave();rIdx();
}
function edtIdx(id){
  var idx=DB.idx.find(function(x){return x.id===id;});if(!idx)return;
  document.getElementById("ixid").value=id;document.getElementById("ixtipo").value=idx.tipo;
  document.getElementById("ixpct").value=idx.pct;document.getElementById("ixini").value=idx.ini;
  document.getElementById("ixfim").value=idx.fim||"";document.getElementById("ixobs").value=idx.obs||"";
  document.getElementById("ixft").textContent="Editar indice";
  document.getElementById("ixsav").textContent="Salvar alteracoes";

}
function canIdx(){

  var t=document.getElementById("ixft");if(t)t.textContent="Novo indice";

function delIdx(id){if(!confirm("Remover indice?"))return;DB.idx=DB.idx.filter(function(x){return x.id!==id;});dbSave();rIdx();}

// MONITORAMENTO DE COLABORADORES
var MPAL=["#ED0010","#c0392b","#e6a817","#7b3fa0","#1a7a4a","#B5000D","#e67e22","#5d6d7e","#16a085","#d35400"];
function rMon(){
  killCH();
  var anoAtual=String(new Date().getFullYear());
  var selAno=gv("mon-ano")||anoAtual;
  var selMes=gv("mon-mes")||curMes();
  selMes=selAno+"-"+selMes.split("-")[1];

  var anos={};anos[anoAtual]=1;
  DB.emp.forEach(function(e){if(!vis(e))return;if(e.adm)anos[e.adm.slice(0,4)]=1;if(e.dem)anos[e.dem.slice(0,4)]=1;});
  var anoOpts=Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");

  function fimMes(m){var p=m.split("-");var d=new Date(+p[0],+p[1],0);return p[0]+"-"+p[1]+"-"+String(d.getDate()).padStart(2,"0");}
  function prevMes(m){var p=m.split("-").map(Number);var d=new Date(p[0],p[1]-2,1);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");}
  var EMPV=DB.emp.filter(vis),ocV=ocVisF();
  function quadro(m){var f=fimMes(m);return EMPV.filter(function(e){return e.adm&&e.adm<=f&&(!e.dem||e.dem>f);}).length;}
  function contr(m){return EMPV.filter(function(e){return e.adm&&e.adm.slice(0,7)===m;});}
  function demit(m){return EMPV.filter(function(e){return e.dem&&e.dem.slice(0,7)===m;});}

  var ultimo=selAno===anoAtual?new Date().getMonth()+1:12;
  if(selAno>anoAtual)ultimo=12;
  var meses=[];for(var i=1;i<=ultimo;i++)meses.push(selAno+"-"+String(i).padStart(2,"0"));
  var lbl=meses.map(function(m){return MOS[parseInt(m.split("-")[1],10)-1];});
  var aQuadro=meses.map(quadro),aContr=meses.map(function(m){return contr(m).length;}),aDem=meses.map(function(m){return demit(m).length;});

  var ativos=EMPV.filter(isAtivo).length,inativos=EMPV.length-ativos;
  var qMes=quadro(selMes),qIni=quadro(prevMes(selMes));
  var cMes=contr(selMes),dMes=demit(selMes);
  var media=(qIni+qMes)/2;
  var turn=media>0?((cMes.length+dMes.length)/2)/media*100:0;
  var mlb=fmtM(selMes);
  var dAno=EMPV.filter(function(e){return e.dem&&e.dem.slice(0,4)===selAno;});
  var cAno=EMPV.filter(function(e){return e.adm&&e.adm.slice(0,4)===selAno;});

  function motBD(list){
    var map={};list.forEach(function(e){var n=motDemNome(e.motdem);map[n]=(map[n]||0)+1;});
    var lbs=Object.keys(map).sort(function(a,b){return map[b]-map[a];});
    return{labels:lbs,values:lbs.map(function(k){return map[k];}),colors:lbs.map(function(k){var i=DB.motdem.findIndex(function(m){return m.nome===k;});return i<0?"#9aa3ad":MPAL[i%MPAL.length];})};
  }
  var bdMes=motBD(dMes),bdAno=motBD(dAno);

  // ABSENTEISMO = faltas / (colaboradores x dias uteis) x 100  (dias uteis = seg a sex; mes atual conta ate hoje)
  function diasUteis(m){
    var p=m.split("-").map(Number),hj=hoje(),n=0,last=new Date(p[0],p[1],0).getDate();
    for(var d=1;d<=last;d++){
      var ds=m+"-"+String(d).padStart(2,"0");
      if(ds>hj)break;
      var w=new Date(p[0],p[1]-1,d).getDay();
      if(w!==0&&w!==6)n++;
    }
    return n;
  }
  function absent(m,ccid){
    var f=fimMes(m),ini=m+"-01";
    var emps=EMPV.filter(function(e){return e.adm&&e.adm<=f&&(!e.dem||e.dem>=ini)&&(ccid===undefined||(e.ccid||"")===ccid);});
    var ids={};emps.forEach(function(e){ids[e.id]=1;});
    var faltas=DB.oc.filter(function(o){return o.tipo==="falta"&&gmk(o.data)===m&&ocV(o)&&(ccid===undefined||ids[o.eid]);}).length;
    var atrasos=DB.oc.filter(function(o){return o.tipo==="atraso"&&gmk(o.data)===m&&ocV(o)&&(ccid===undefined||ids[o.eid]);}).length;
    var du=diasUteis(m),base=emps.length*du;
    return{pct:base>0?faltas/base*100:0,faltas:faltas,atrasos:atrasos,du:du,hc:emps.length};
  }
  var aAbs=meses.map(function(m){return absent(m);});
  var absMes=absent(selMes);
  var absAnoF=0,absAnoB=0;
  meses.forEach(function(m,i){absAnoF+=aAbs[i].faltas;absAnoB+=aAbs[i].hc*aAbs[i].du;});
  var absAno=absAnoB>0?absAnoF/absAnoB*100:0;
  var duAno=aAbs.reduce(function(a,r){return a+r.du;},0);
  // acumulado do ano mes a mes (faltas somadas / base somada)
  var accF=0,accB=0,aAbsAcc=aAbs.map(function(r){accF+=r.faltas;accB+=r.hc*r.du;return accB>0?accF/accB*100:0;});
  // absenteismo do ano por centro de custo
  function absentAno(ccid){
    var f=0,b=0,hc={};
    meses.forEach(function(m){var r=absent(m,ccid);f+=r.faltas;b+=r.hc*r.du;});
    return{pct:b>0?f/b*100:0,faltas:f};
  }
  // absenteismo do ano por colaborador (dias uteis dos meses em que estava na empresa)
  var rankAbs=EMPV.map(function(e){
    var du=0,f=0;
    meses.forEach(function(m){
      var fim=fimMes(m),ini=m+"-01";
      if(!(e.adm&&e.adm<=fim&&(!e.dem||e.dem>=ini)))return;
      du+=diasUteis(m);
      f+=DB.oc.filter(function(o){return o.eid===e.id&&o.tipo==="falta"&&gmk(o.data)===m;}).length;
    });
    return{e:e,f:f,du:du,pct:du>0?f/du*100:0};
  }).filter(function(x){return x.f>0;}).sort(function(a,b){return b.pct-a.pct||b.f-a.f;});
  var ccAbs=DB.cc.map(function(c){var r=absent(selMes,c.id);r.lb=c.cod+" - "+c.desc;r.ano=absentAno(c.id);return r;});
  var semCC=absent(selMes,"");semCC.ano=absentAno("");if(semCC.hc>0||semCC.ano.faltas>0){semCC.lb="Sem centro";ccAbs.push(semCC);}
  ccAbs=ccAbs.filter(function(r){return r.hc>0||r.ano.pct>0;}).sort(function(a,b){return b.ano.pct-a.ano.pct||b.pct-a.pct;});
  function pctF(v){return v.toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:2})+"%";}

  var movs=cMes.map(function(e){return{t:"c",d:e.adm,e:e};}).concat(dMes.map(function(e){return{t:"d",d:e.dem,e:e};}))
    .sort(function(a,b){return b.d.localeCompare(a.d);});
  var movHTML=movs.length===0?"<div class='empty' style='padding:1.5rem'><i class='ti ti-arrows-exchange'></i>Sem admissoes ou demissoes em "+mlb+"</div>":
    movs.map(function(x){
      var c=x.t==="c";
      return "<div style='display:flex;align-items:center;gap:10px;padding:.5rem 0;border-bottom:1px solid #f2f1f1'>"
        +"<div style='width:30px;height:30px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:"+(c?GRN:RED)+"18;color:"+(c?GRN:RED)+"'><i class='ti "+(c?"ti-user-plus":"ti-user-minus")+"' style='font-size:16px'></i></div>"
        +"<div style='min-width:0;flex:1'><div style='font-weight:700;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis'>"+esc(x.e.nome)+"</div>"
        +"<div style='font-size:11px;color:#999'>"+(c?"Admissao":"Demissao")+" em "+fmtD(x.d)+(c?"":" &middot; "+esc(motDemNome(x.e.motdem)))+"</div></div></div>";
    }).join("");

  function chartCard(title,color,icon,inner,h){
    return "<div class='card' style='padding:.9rem'>"
      +"<div style='font-weight:700;font-size:13px;color:"+color+";margin-bottom:.5rem'><i class='ti "+icon+"' style='margin-right:4px'></i>"+title+"</div>"
      +(h?"<div style='height:"+h+"px;position:relative'>"+inner+"</div>":inner)+"</div>";
  }
  function semDados(msg){return "<div class='empty' style='padding:2.5rem 1rem'><i class='ti ti-chart-pie'></i>"+msg+"</div>";}

  document.getElementById("p-monitor").innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Monitoramento de Colaboradores</h1>"
    +"<div class='sub'>Quadro, contratacoes, demissoes, absenteismo e motivos de saida</div></div>"
    +"<div style='display:flex;align-items:center;gap:8px;flex-wrap:wrap'>"
    +"<div style='display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #e3dfdf;border-radius:8px;padding:.35rem .75rem'>"
    +"<i class='ti ti-calendar' style='color:#888;font-size:15px'></i><span style='font-size:12px;color:#555;font-weight:600'>Ano:</span>"
    +"<select id='mon-ano' onchange='rMon()' style='border:none;outline:none;box-shadow:none;font-size:13px;color:"+B+";font-weight:700;background:transparent;width:auto;padding:0'>"+anoOpts+"</select></div>"
    +"<div style='display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid #e3dfdf;border-radius:8px;padding:.35rem .75rem'>"
    +"<i class='ti ti-calendar-event' style='color:#888;font-size:15px'></i><span style='font-size:12px;color:#555;font-weight:600'>Mes:</span>"
    +"<select id='mon-mes' onchange='rMon()' style='border:none;outline:none;box-shadow:none;font-size:13px;color:"+B+";font-weight:700;background:transparent;width:auto;padding:0'>"
    +MOS.map(function(m,i){var v=selAno+"-"+String(i+1).padStart(2,"0");return "<option value='"+v+"'"+(v===selMes?" selected":"")+">"+m+"</option>";}).join("")
    +"</select></div>"
    +"<button class='btng btn-ic' onclick='gerarMonitorPDF()'><i class='ti ti-file-download'></i>Relatorio PDF</button>"
    +"<button class='btnp btn-ic' onclick=\"go('employees');setTimeout(novoEmp,30)\"><i class='ti ti-user-plus'></i>Novo colaborador</button>"
    +"</div></div>"

    +"<div class='ga' style='margin-bottom:1.25rem'>"
    +sCard("Total de colaboradores",ativos,B,"ti-users",inativos+" inativo"+(inativos!==1?"s":""))
    +sCard("Quadro no fim do mes",qMes,BL,"ti-id-badge-2",mlb)
    +sCard("Contratados no mes",cMes.length,GRN,"ti-user-plus",mlb+" · "+cAno.length+" no ano")
    +sCard("Demitidos no mes",dMes.length,RED,"ti-user-minus",mlb+" · "+dAno.length+" no ano")
    +sCard("Turnover do mes",turn.toLocaleString("pt-BR",{maximumFractionDigits:1})+"%",GLD,"ti-arrows-exchange",mlb)
    +sCard("Absenteismo do mes",pctF(absMes.pct),"#d35400","ti-calendar-x",absMes.faltas+" falta"+(absMes.faltas!==1?"s":"")+" · "+absMes.du+" dias uteis")
    +sCard("Absenteismo do ano",pctF(absAno),"#a04000","ti-calendar-stats",absAnoF+" falta"+(absAnoF!==1?"s":"")+" · "+duAno+" dias uteis · "+selAno)
    +"</div>"

    +"<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1rem;margin-bottom:1rem'>"
    +chartCard("Total de colaboradores por mes - "+selAno,B,"ti-users","<canvas id='ch-mquadro'></canvas>",230)
    +chartCard("Contratados x Demitidos por mes - "+selAno,GRN,"ti-arrows-exchange","<canvas id='ch-mmov'></canvas>",230)
    +"</div>"
    +"<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:1rem;margin-bottom:1rem'>"
    +chartCard("Absenteismo por mes e acumulado do ano - "+selAno,"#d35400","ti-calendar-x","<div style='height:230px;position:relative'><canvas id='ch-mabs'></canvas></div>"
      +"<div class='hint' style='margin-top:6px'>Absenteismo = faltas &divide; (colaboradores no mes &times; dias uteis seg-sex) &times; 100. No mes atual, conta os dias ate hoje.</div>")
    +chartCard("Absenteismo por centro de custo - "+mlb+" x ano "+selAno,"#d35400","ti-building",ccAbs.length
      ?"<div style='height:"+Math.max(230,ccAbs.length*48+50)+"px;position:relative'><canvas id='ch-mabscc'></canvas></div>"
      :semDados("Sem colaboradores com centro de custo em "+selAno))
    +"</div>"
    +chartCard("Absenteismo do ano por colaborador - "+selAno+" <span style='color:#999;font-weight:500'>("+rankAbs.length+" com faltas no ano)</span>","#a04000","ti-calendar-stats",
      rankAbs.length===0?semDados("Nenhuma falta em "+selAno):
      "<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:0 2rem;max-height:340px;overflow-y:auto'>"
      +rankAbs.map(function(x,i){
        var mx=rankAbs[0].pct||1,w=Math.max(3,x.pct/mx*100),cor=i<3?"#a04000":"#d35400";
        return "<div style='display:flex;align-items:center;gap:10px;padding:.45rem 0;border-bottom:1px solid #f2f1f1'>"

          +"<div style='min-width:0;flex:1'>"

    +"<div style='height:1rem'></div>"

    +"<div style='display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:1rem'>"

    +chartCard("Movimentacoes - "+mlb,B,"ti-list-details","<div style='max-height:250px;overflow-y:auto'>"+movHTML+"</div>")

  window._monStats={selAno:selAno,selMes:selMes,mlb:mlb,meses:meses,lbl:lbl,ativos:ativos,inativos:inativos,qMes:qMes,

  var M=window._monStats;

// ---- graficos do Monitoramento (tela e PDF; s = escala das fontes) ----
function pctF2(v){return (v||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:2})+"%";}
function monLeg(s){return{position:"top",labels:{boxWidth:12*s,font:{size:12*s},padding:10*s,
  generateLabels:function(ch){return ch.data.datasets.map(function(ds,i){var c=ds.hoverBackgroundColor||ds.borderColor;return{text:ds.label,fillStyle:c,strokeStyle:c,lineWidth:0,hidden:!ch.isDatasetVisible(i),datasetIndex:i};});}}};}
function monDL(s,fmt){return{display:function(c){return c.dataset.data[c.dataIndex]>0;},anchor:"end",align:"top",offset:3*s,
  color:function(c){return c.dataset.dlc;},font:{size:12.5*s,weight:800},formatter:fmt};}
function monBase(s){return{responsive:s===1,maintainAspectRatio:false,animation:s===1?{}:false};}
function monX(s){return{ticks:{font:{size:12*s,weight:600},color:"#555"},grid:{display:false}};}
function monCfgQuadro(M,s){
  return{type:"bar",plugins:relDL(),
    data:{labels:M.lbl,datasets:[{label:"Colaboradores",data:M.aQuadro,backgroundColor:vGrad(BL),hoverBackgroundColor:BL,dlc:B,borderRadius:6*s,borderSkipped:false,maxBarThickness:60*s}]},
    options:Object.assign(monBase(s),{plugins:{legend:{display:false},datalabels:monDL(s)},
      scales:{y:{beginAtZero:true,grace:"15%",ticks:{precision:0,font:{size:11*s},color:"#7a838c"},grid:{color:"#f2f1f1"},border:{display:false}},x:monX(s)}})};
}
function monCfgMov(M,s){
  return{type:"bar",plugins:relDL(),
    data:{labels:M.lbl,datasets:[
      {label:"Contratados",data:M.aContr,backgroundColor:vGrad(GRN),hoverBackgroundColor:GRN,dlc:GRN,borderRadius:6*s,borderSkipped:false,maxBarThickness:36*s},
      {label:"Demitidos",data:M.aDem,backgroundColor:vGrad(RED),hoverBackgroundColor:RED,dlc:RED,borderRadius:6*s,borderSkipped:false,maxBarThickness:36*s}]},
    options:Object.assign(monBase(s),{plugins:{legend:monLeg(s),datalabels:monDL(s)},
      scales:{y:{beginAtZero:true,grace:"15%",ticks:{precision:0,font:{size:11*s},color:"#7a838c"},grid:{color:"#f2f1f1"},border:{display:false}},x:monX(s)}})};
}
function monCfgAbs(M,s){
  var ORG="#d35400",DK="#7a2f00";
  return{type:"bar",plugins:relDL(),
    data:{labels:M.lbl,datasets:[
      {type:"line",label:"Acumulado do ano",data:M.aAbsAcc.map(function(v){return +v.toFixed(2);}),order:0,borderColor:DK,backgroundColor:DK,
        borderDash:[6*s,4*s],borderWidth:2.2*s,pointRadius:3*s,pointBackgroundColor:"#fff",pointBorderColor:DK,pointBorderWidth:2*s,tension:.3,
        datalabels:{display:function(c){return c.dataIndex===c.dataset.data.length-1;},align:"top",anchor:"center",offset:8*s,color:"#fff",backgroundColor:DK,borderRadius:4*s,
          padding:{top:2*s,bottom:1*s,left:5*s,right:5*s},font:{size:11.5*s,weight:800},formatter:function(v){return "Ano "+pctF2(v);}}},
      {label:"Absenteismo do mes",data:M.aAbs.map(function(r){return +r.pct.toFixed(2);}),order:1,backgroundColor:vGrad(ORG),hoverBackgroundColor:ORG,dlc:ORG,borderRadius:6*s,borderSkipped:false,maxBarThickness:60*s,
        datalabels:monDL(s,function(v){return pctF2(v);})}]},
    options:Object.assign(monBase(s),{layout:{padding:{right:10*s}},
      plugins:{legend:monLeg(s),
        tooltip:{callbacks:{label:function(c){var r=M.aAbs[c.dataIndex];if(c.dataset.type==="line")return "Acumulado do ano ate "+M.lbl[c.dataIndex]+": "+pctF2(c.raw);return ["Absenteismo do mes: "+pctF2(r.pct),r.faltas+" faltas · "+r.atrasos+" atrasos","Colaboradores: "+r.hc+" · Dias uteis: "+r.du];}}}},

// ═══ KIT PDF PADRAO FERMAR (cabecalho com logo, paineis, tabelas, rodape) ═══
function mkPdfKit(titulo,periodo,orient){
  var retrato=orient==="portrait";
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:retrato?"portrait":"landscape",compress:true});
  var K={doc:doc,W:retrato?210:297,H:retrato?297:210,mg:12,BANDH:27,PX:7};
  K.cw=K.W-K.mg*2;
  var C=K.C={ink:[22,20,21],b:[181,0,13],bl:[237,0,16],red:[192,57,43],grn:[26,122,74],gld:[230,168,23],pur:[123,63,160],org:[211,84,0],dk:[122,47,0],line:[230,226,226],txt:[60,60,60],mut:[140,140,140]};
  function fill(c){doc.setFillColor(c[0],c[1],c[2]);}
  function txt(c){doc.setTextColor(c[0],c[1],c[2]);}
  function font(sz,b){doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(sz);}
  K.fill=fill;K.txt=txt;K.font=font;
  var agora=new Date(),gerado=agora.toLocaleDateString("pt-BR")+" às "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  K.header=function(){
    fill(C.ink);doc.rect(0,0,K.W,K.BANDH,"F");fill(C.bl);doc.rect(0,K.BANDH,K.W,1.3,"F");
    if(window._logoPNG)doc.addImage(window._logoPNG,"PNG",K.mg,6.5,64.4,14);
    else{font(18,true);txt([255,255,255]);doc.text("FERMAR",K.mg,16);}
    font(15,true);txt([255,255,255]);doc.text(titulo,K.W-K.mg,11.5,{align:"right"});
    font(8.5);txt([205,212,222]);doc.text(periodo,K.W-K.mg,17.5,{align:"right"});
    font(7);txt([165,175,190]);doc.text("Gerado em "+gerado,K.W-K.mg,22,{align:"right"});
    return K.BANDH+8;
  };
  K.section=function(t,y,c){fill(c||C.b);doc.rect(K.mg,y-3.1,2.2,2.2,"F");font(10.5,true);txt([45,45,45]);doc.text(t,K.mg+4.5,y);};
  K.panel=function(x,y,w,h){doc.setFillColor(255,255,255);doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.35);doc.roundedRect(x,y,w,h,2,2,"FD");};
  K.kpi=function(x,y,w,h,lb,val,sub,c){
    K.panel(x,y,w,h);fill(c);doc.rect(x,y,w,1.2,"F");
    font(6.2,true);txt(C.mut);var lbs=doc.splitTextToSize(lb.toUpperCase(),w-5).slice(0,2);
    doc.text(lbs,x+2.8,y+5.4,{lineHeightFactor:1.15});
    var vy=lbs.length>1?y+14.6:y+12.4;
    font(12.5,true);txt(c);doc.text(String(val),x+2.8,vy);
    if(sub){font(6);txt(C.mut);var ls=doc.splitTextToSize(sub,w-5);doc.text(ls[0],x+2.8,vy+4.4);}
  };
  K.chartImg=function(cfg,wmm,hmm){
    if(!cfg)return null;
    var cv=document.createElement("canvas");cv.width=Math.round(wmm*K.PX);cv.height=Math.round(hmm*K.PX);
    cv.style.position="fixed";cv.style.left="-99999px";document.body.appendChild(cv);
    var ch=new Chart(cv,cfg);var img=ch.toBase64Image();ch.destroy();cv.remove();return img;
  };
  K.chartPanel=function(cfg,x,y,w,h,t,c,nota){
    K.panel(x,y,w,h);font(9,true);txt(c);doc.text(t,x+4,y+6.5);
    if(nota){font(7);txt(C.mut);doc.text(nota,x+w-4,y+6.5,{align:"right"});}
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x+4,y+8.8,x+w-4,y+8.8);
    var aw=w-8,ah=h-13;var img=typeof cfg==="function"?K.chartImg(cfg(aw,ah),aw,ah):K.chartImg(cfg,aw,ah);
    if(!img){font(8.5);txt([185,185,185]);doc.text("Sem dados no período",x+w/2,y+h/2,{align:"center"});return;}
    doc.addImage(img,"PNG",x+4,y+10.5,aw,ah);
  };
  K.table=function(y,cols,rows,opt){
    opt=opt||{};var rh=opt.rh||5.6,x=opt.x||K.mg,tw=cols.reduce(function(a,c){return a+c.w;},0);
    function head(){
      fill(C.b);doc.rect(x,y,tw,rh+.6,"F");font(7.3,true);txt([255,255,255]);
      var cx=x;cols.forEach(function(c){doc.text(c.h,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.6,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});cx+=c.w;});
      y+=rh+.6;
    }
    head();
    rows.forEach(function(r,i){
      if(y+rh>K.H-14){doc.addPage();y=K.header();if(opt.titulo)K.section(opt.titulo+" (continuação)",y,opt.cor);y+=4;head();}
      if(r._total){fill([226,236,246]);doc.rect(x,y,tw,rh+.4,"F");}
      else if(r._hl){fill([227,240,250]);doc.rect(x,y,tw,rh,"F");}
      else if(i%2===1){fill([248,250,252]);doc.rect(x,y,tw,rh,"F");}
      var cx=x;
      cols.forEach(function(c){
        var v=r[c.k];v=v===undefined||v===null?"":String(v);
        font(7.2,r._total||r._hl||c.b);
        while(v.length>3&&doc.getTextWidth(v)>c.w-3)v=v.slice(0,-2);
        txt(r._total&&!c.cor?C.b:(c.cor?c.cor(r):C.txt));
        doc.text(v,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.5,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});
        cx+=c.w;
      });
      y+=r._total?rh+.4:rh;
    });
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x,y,x+tw,y);
    return y;
  };
  K.finalizar=function(nome){
    var n=doc.getNumberOfPages();
    for(var p=1;p<=n;p++){
      doc.setPage(p);doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.3);doc.line(K.mg,K.H-9,K.W-K.mg,K.H-9);
      font(7.2);txt([160,160,160]);
      doc.text("Fermar Metalúrgica e Serralheria - Gestão de Prêmios",K.mg,K.H-5);
      doc.text(titulo,K.W/2,K.H-5,{align:"center"});
      doc.text("Página "+p+"/"+n,K.W-K.mg,K.H-5,{align:"right"});
    }
    doc.save(nome);
  };
  return K;
}
