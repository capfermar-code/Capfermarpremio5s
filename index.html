function fecharEmpPDF(){var m=document.getElementById("md-emppdf");if(m)m.remove();}
function gerarEmpPDF(orient){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("As bibliotecas ainda estao carregando. Aguarde alguns segundos e tente novamente.");return;}
  var sit=gv("pdfsit")||"ativos",comSal=!!(document.getElementById("pdfsal")&&document.getElementById("pdfsal").checked);
  var lista=DB.emp.filter(function(e){
    if(!vis(e))return false;
    var a=isAtivo(e);
    return sit==="todos"||(sit==="ativos"?a:!a);
  });
  if(!lista.length){alert("Nenhum colaborador para imprimir nesta situacao.");return;}
  var sitLb={ativos:"Ativos",inativos:"Inativos",todos:"Todos"}[sit];
  var K=mkPdfKit("Colaboradores por Centro de Custo","Situação: "+sitLb+"  |  "+lista.length+" colaborador"+(lista.length!==1?"es":""),orient),doc=K.doc,C=K.C;
  var retrato=orient==="portrait",cw=K.cw;
  // grupos por centro de custo (ordem do codigo) + "Sem centro de custo" no final
  var grupos=DB.cc.slice().sort(function(a,b){return (a.cod||"").localeCompare(b.cod||"",undefined,{numeric:true});})
    .map(function(c){return{lb:c.cod+" - "+c.desc,emps:lista.filter(function(e){return e.ccid===c.id;})};});
  var semCC=lista.filter(function(e){return !e.ccid||!DB.cc.some(function(c){return c.id===e.ccid;});});
  if(semCC.length)grupos.push({lb:"Sem centro de custo",emps:semCC});
  grupos=grupos.filter(function(g){return g.emps.length;});
  // colunas (a ultima absorve a sobra da largura)
  var cols=[{h:"#",k:"i",w:8,al:"c"},{h:"Colaborador",k:"nome",w:retrato?46:92,b:true,cor:function(){return C.b;}},{h:"Função",k:"func",w:retrato?34:62},
    {h:"Vínculo",k:"vinc",w:14,al:"c",cor:function(r){return r.vinc==="MEI"?[123,63,160]:[31,95,168];}},
    {h:"Admissão",k:"adm",w:20,al:"c"},{h:"Tempo de empresa",k:"tempo",w:retrato?24:30,al:"c"}];
  if(sit!=="ativos")cols.push({h:"Situação",k:"sit",w:retrato?18:24,al:"c",cor:function(r){return r.sit==="Ativo"?C.grn:C.mut;}});
  if(comSal)cols.push({h:"Salário",k:"sal",w:24,al:"r"});
  var usado=cols.reduce(function(a,c){return a+c.w;},0);cols[1].w+=Math.max(0,cw-usado);
  var y=K.header(),totGeral=0;
  grupos.forEach(function(g,gi){
    if(y+24>K.H-14){doc.addPage();y=K.header();}
    var tot=0;
    var rows=g.emps.slice().sort(function(a,b){return a.nome.localeCompare(b.nome);}).map(function(e,i){
      var sv=typeof e.sal==="number"?e.sal:null;if(sv)tot+=sv;
      return{i:i+1,nome:e.nome,func:e.func||"",vinc:empVinc(e),adm:fmtD(e.adm),tempo:e.adm?tEmp(e.adm,e.dem):"",sit:isAtivo(e)?"Ativo":(e.dem?"Demitido":"Inativo"),sal:sv===null?"-":fmtBRL(sv)};
    });
    totGeral+=tot;
    if(comSal){var tr={_total:true,nome:"Total do centro de custo",sal:fmtBRL(tot)};rows.push(tr);}
    var tit=g.lb+" ("+g.emps.length+" colaborador"+(g.emps.length!==1?"es":"")+")";
    K.section(tit,y,C.bl);y+=3;
    y=K.table(y,cols,rows,{rh:5.8,titulo:tit,cor:C.bl})+9;
  });
  if(comSal){
    if(y+10>K.H-14){doc.addPage();y=K.header();}
    K.fill([226,236,246]);doc.rect(K.mg,y-5,cw,8,"F");
    K.font(9,true);K.txt(C.b);doc.text("Total geral de salários ("+lista.length+" colaborador"+(lista.length!==1?"es":"")+")",K.mg+3,y);
    doc.text(fmtBRL(totGeral),K.mg+cw-3,y,{align:"right"});
  }
  K.finalizar("colaboradores-centro-de-custo-"+(retrato?"retrato":"paisagem")+".pdf");
  fecharEmpPDF();
}

// ═══ PDF: MONITORAMENTO DE COLABORADORES ═══
function gerarMonitorPDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)||typeof Chart==="undefined"){alert("As bibliotecas ainda estao carregando. Aguarde alguns segundos e tente novamente.");return;}
  var M=window._monStats;if(!M){alert("Abra a tela de Monitoramento antes de gerar o PDF.");return;}
  var K=mkPdfKit("Monitoramento de Colaboradores","Mês: "+M.mlb+"  |  Ano: "+M.selAno),doc=K.doc,C=K.C,mg=K.mg,cw=K.cw,gap=3.2;
  function mesNome(m){return fmtM(m);}

  // ===== PAGINA 1: indicadores e graficos =====
  var y=K.header();
  K.section("Indicadores - "+M.mlb,y);y+=3.5;
  var ks=[
    ["Total de colaboradores",String(M.ativos),M.inativos+" inativos",C.b],
    ["Quadro no fim do mês",String(M.qMes),M.mlb,C.bl],
    ["Contratados no mês",String(M.cMes),M.cAno+" no ano",C.grn],
    ["Demitidos no mês",String(M.dMes),M.dAno+" no ano",C.red],
    ["Turnover do mês",pct1(M.turn),M.mlb,C.gld],
    ["Absenteísmo do mês",pctF2(M.absMes.pct),M.absMes.faltas+" faltas / "+M.absMes.du+" dias úteis",C.org],
    ["Absenteísmo do ano",pctF2(M.absAno),M.absAnoF+" faltas / "+M.duAno+" dias úteis",C.dk]
  ];
  var kw=(cw-gap*6)/7,kh=22;
  ks.forEach(function(k,i){K.kpi(mg+i*(kw+gap),y,kw,kh,k[0],k[1],k[2],k[3]);});
  y+=kh+4;
  var hw=(cw-gap)/2,ph=(K.H-12-y-gap)/2;
  K.chartPanel(monCfgQuadro(M,1.5),mg,y,hw,ph,"Total de colaboradores por mês - "+M.selAno,C.b);
  K.chartPanel(monCfgMov(M,1.5),mg+hw+gap,y,hw,ph,"Contratados x Demitidos por mês - "+M.selAno,C.grn);
  y+=ph+gap;
  K.chartPanel(monCfgAbs(M,1.5),mg,y,hw,ph,"Absenteísmo por mês e acumulado do ano - "+M.selAno,C.org);
  K.chartPanel(M.ccAbs.length?monCfgAbsCC(M,1.35):null,mg+hw+gap,y,hw,ph,"Absenteísmo por centro de custo - "+M.mlb+" x "+M.selAno,C.org);

  // ===== PAGINA 2: motivos, movimentacoes e resumo mes a mes =====
  doc.addPage();y=K.header();
  K.section("Motivos de saída e movimentações",y,C.red);y+=3.5;
  var tw=(cw-gap*2)/3,th=64;
  K.chartPanel(monCfgPie(M.bdMes,1.5),mg,y,tw,th,"Motivos de saída - "+M.mlb,C.red);
  K.chartPanel(monCfgPie(M.bdAno,1.5),mg+tw+gap,y,tw,th,"Motivos de saída - "+M.selAno,C.red);
  var mx=mg+2*(tw+gap);
  K.panel(mx,y,tw,th);K.font(9,true);K.txt(C.b);doc.text("Movimentações - "+M.mlb,mx+4,y+6.5);
  doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(mx+4,y+8.8,mx+tw-4,y+8.8);
  var my=y+14,maxL=Math.floor((th-16)/7.2);
  if(!M.movs.length){K.font(8.5);K.txt([185,185,185]);doc.text("Sem admissões ou demissões no mês",mx+tw/2,y+th/2,{align:"center"});}
  M.movs.slice(0,maxL).forEach(function(mv){
    var ad=mv.t==="c",cor=ad?C.grn:C.red;
    K.fill(cor);doc.roundedRect(mx+4,my-3.2,2.6,2.6,.5,.5,"F");
    K.font(7.6,true);K.txt([40,40,40]);
    var nm=mv.e.nome;while(nm.length>3&&doc.getTextWidth(nm)>tw-12)nm=nm.slice(0,-2);
    doc.text(nm,mx+8.5,my-.9);
    K.font(6.6);K.txt(C.mut);
    doc.text((ad?"Admissão":"Demissão")+" em "+fmtD(mv.d)+(ad?"":" · "+motDemNome(mv.e.motdem)),mx+8.5,my+2.4);
    my+=7.2;
  });
  if(M.movs.length>maxL){K.font(7);K.txt(C.mut);doc.text("+ "+(M.movs.length-maxL)+" movimentações",mx+8.5,my-1);}
  y+=th+8;

  K.section("Resumo mês a mês - "+M.selAno,y);y+=3;
  var colsR=[
    {h:"Mês",k:"mes",w:34,b:true,cor:function(){return C.b;}},{h:"Quadro (fim do mês)",k:"q",w:32,al:"c"},
    {h:"Contratados",k:"c",w:26,al:"c",cor:function(){return C.grn;}},{h:"Demitidos",k:"d",w:24,al:"c",cor:function(){return C.red;}},
    {h:"Faltas",k:"f",w:22,al:"c"},{h:"Atrasos",k:"a",w:22,al:"c"},{h:"Colaboradores no mês",k:"hc",w:36,al:"c"},
    {h:"Dias úteis",k:"du",w:22,al:"c"},{h:"Absenteísmo do mês",k:"abs",w:30,al:"r",cor:function(){return C.org;}}
  ];
  colsR.push({h:"Acumulado do ano",k:"acc",w:cw-colsR.reduce(function(a,c){return a+c.w;},0),al:"r",cor:function(){return C.dk;}});
  var rowsR=M.meses.map(function(m,i){var r=M.aAbs[i];
    return{mes:mesNome(m),q:M.aQuadro[i],c:M.aContr[i],d:M.aDem[i],f:r.faltas,a:r.atrasos,hc:r.hc,du:r.du,abs:pctF2(r.pct),acc:pctF2(M.aAbsAcc[i]),_hl:m===M.selMes};});

var relModo="mes",ORGc="#d35400";
function pct1(v){return (v||0).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+"%";}
function fmtK(v){v=v||0;return Math.abs(v)>=10000?"R$"+(v/1000).toLocaleString("pt-BR",{maximumFractionDigits:1})+" mil":fmtBRLInt(v);}
function fimMesStr(m){var p=m.split("-");var d=new Date(+p[0],+p[1],0);return m+"-"+String(d.getDate()).padStart(2,"0");}
function dUteis(m){
  var p=m.split("-").map(Number),hj=hoje(),n=0,last=new Date(p[0],p[1],0).getDate();
  for(var d=1;d<=last;d++){
    if(m+"-"+String(d).padStart(2,"0")>hj)break;
    var w=new Date(p[0],p[1]-1,d).getDay();if(w!==0&&w!==6)n++;
  }
  return n;
}
// Meses do ano com lancamentos (mesma regra do Dashboard) + mes atual
function mesesRel(ano){
  var s={};DB.oc.forEach(function(o){var m=gmk(o.data);if(m.slice(0,4)===ano)s[m]=1;});
  if(ano===String(new Date().getFullYear()))s[curMes()]=1;
  return Object.keys(s).sort();
}
function relFin(r){
  r.pctGanho=r.pot>0?r.pago/r.pot*100:0;
  r.pctPerda=r.pot>0?r.perd/r.pot*100:0;
  r.abs=r.absBase>0?r.absF/r.absBase*100:0;
  return r;
}
// Dados de um mes: premio previsto, pago, perdido (dividido por tipo), absenteismo
function relMes(m,se){
  var r={m:m,linhas:[],pot:0,pago:0,perd:0,lf:0,la:0,ls:0,nf:0,na:0,ns:0,ok:0,absF:0,absBase:0};
  DB.emp.forEach(function(e){
    if(se&&e.id!==se)return;
    if(!contaNoMes(e,m))return;
    var pr=DB.pr.find(function(p){return p.eid===e.id;});if(!pr)return;
    var d=calcDesc(e.id,m,pr.val);
    var pf=0,pa=0,ps=0;
    DB.oc.forEach(function(x){
      if(x.eid!==e.id||gmk(x.data)!==m)return;
      var p=getPct(x.tipo,x.data);
      if(x.tipo==="falta")pf+=p;else if(x.tipo==="atraso")pa+=p;else if(x.tipo==="5s")ps+=p;
    });
    var raw=pf+pa+ps,k=raw>0?d.desc/raw:0; // desconto limitado a 100%: rateia proporcionalmente
    var l={emp:e,val:pr.val,f:d.f,a:d.a,s:d.s,pct:d.pct,desc:d.desc,rec:d.rec,lf:pf*k,la:pa*k,ls:ps*k};
    r.linhas.push(l);
    r.pot+=l.val;r.pago+=l.rec;r.perd+=l.desc;r.lf+=l.lf;r.la+=l.la;r.ls+=l.ls;r.nf+=l.f;r.na+=l.a;r.ns+=l.s;
    if(l.pct===0)r.ok++;
  });
  var fim=fimMesStr(m),ini=m+"-01",ids={};
  DB.emp.forEach(function(e){if((!se||e.id===se)&&e.adm&&e.adm<=fim&&(!e.dem||e.dem>=ini)&&!afastadoNoMes(e,m)&&vis(e))ids[e.id]=1;});
  r.absF=DB.oc.filter(function(o){return o.tipo==="falta"&&gmk(o.data)===m&&ids[o.eid];}).length;
  r.du=dUteis(m);r.hc=Object.keys(ids).length;r.absBase=r.hc*r.du;
  return relFin(r);
}
function relAcum(lista){
  var r={linhas:[],pot:0,pago:0,perd:0,lf:0,la:0,ls:0,nf:0,na:0,ns:0,absF:0,absBase:0},col={};
  lista.forEach(function(x){
    ["pot","pago","perd","lf","la","ls","nf","na","ns","absF","absBase"].forEach(function(k){r[k]+=x[k];});
    x.linhas.forEach(function(l){
      var c=col[l.emp.id]||(col[l.emp.id]={emp:l.emp,val:0,desc:0,rec:0,f:0,a:0,s:0,lf:0,la:0,ls:0});
      ["val","desc","rec","f","a","s","lf","la","ls"].forEach(function(k){c[k]+=l[k];});
    });
  });
  r.linhas=Object.keys(col).map(function(k){var c=col[k];c.pct=c.val>0?c.desc/c.val*100:0;return c;});
  r.ok=r.linhas.filter(function(l){return l.desc<0.005;}).length;
  return relFin(r);
}

function setRelModo(m){relModo=m;rRel();}
function rRel(){

  var selMes=gv("rel-mes")||curMes();selMes=selAno+"-"+selMes.split("-")[1];
  var se=gv("re");

  var anoOpts=Object.keys(anos).sort().reverse().map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");
  var emps=DB.emp.filter(function(e){return vis(e)&&DB.pr.some(function(p){return p.eid===e.id;});}).sort(function(a,b){return a.nome.localeCompare(b.nome);});
  var eOpts="<option value=''>Todos os colaboradores</option>"+emps.map(function(e){return "<option value='"+e.id+"'"+(se===e.id?" selected":"")+">"+esc(e.nome)+(isAtivo(e)?"":" (inativo)")+"</option>";}).join("");

  var meses=mesesRel(selAno);
  var labels=meses.map(function(m){return MOS[parseInt(m.split("-")[1],10)-1];});
  var anoD=meses.map(function(m){return relMes(m,se);});
  var acum=relAcum(anoD);
  var P=relModo==="mes"?relMes(selMes,se):acum;
  var per=relModo==="mes"?fmtM(selMes):"Ano "+selAno+" (Acumulado)";
  var selIdx=relModo==="mes"?meses.indexOf(selMes):-1;
  var empSel=se?DB.emp.find(function(e){return e.id===se;}):null;

// ═══ PDF: ANALISE DO PAGAMENTO DO PREMIO CARTAO FERMAR ═══
function gerarAnalisePDF(){
  if(!(window.jspdf&&window.jspdf.jsPDF)){alert("A biblioteca de PDF ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  if(typeof Chart==="undefined"){alert("A biblioteca de graficos ainda esta carregando. Aguarde alguns segundos e tente novamente.");return;}
  var st=window._relStats;if(!st){alert("Abra a tela de Relatorios antes de gerar o PDF.");return;}
  var doc=new window.jspdf.jsPDF({unit:"mm",format:"a4",orientation:"landscape",compress:true});
  var W=297,H=210,mg=12,cw=W-mg*2,BANDH=27,PX=7;
  var C={ink:[22,20,21],b:[181,0,13],bl:[237,0,16],red:[192,57,43],grn:[26,122,74],gld:[230,168,23],pur:[123,63,160],org:[211,84,0],line:[230,226,226],txt:[60,60,60],mut:[140,140,140]};
  function fill(c){doc.setFillColor(c[0],c[1],c[2]);}
  function txt(c){doc.setTextColor(c[0],c[1],c[2]);}
  function font(sz,b){doc.setFont("helvetica",b?"bold":"normal");doc.setFontSize(sz);}
  var titulo="Análise do Pagamento do Prêmio Cartão Fermar";
  var agora=new Date(),gerado=agora.toLocaleDateString("pt-BR")+" às "+agora.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  var periodo=(st.modo==="mes"?"Período: ":"Período: ")+st.per+(st.empNome?"  |  Colaborador: "+st.empNome:"  |  Todos os colaboradores");

  function header(){
    fill(C.ink);doc.rect(0,0,W,BANDH,"F");
    fill(C.bl);doc.rect(0,BANDH,W,1.3,"F");
    if(window._logoPNG){doc.addImage(window._logoPNG,"PNG",mg,6.5,64.4,14);}
    else{font(18,true);txt([255,255,255]);doc.text("FERMAR",mg,16);}
    font(15,true);txt([255,255,255]);doc.text(titulo,W-mg,11.5,{align:"right"});
    font(8.5);txt([205,212,222]);doc.text(periodo,W-mg,17.5,{align:"right"});
    font(7);txt([165,175,190]);doc.text("Gerado em "+gerado,W-mg,22,{align:"right"});
    return BANDH+8;
  }
  function section(t,y,c){fill(c||C.b);doc.rect(mg,y-3.1,2.2,2.2,"F");font(10.5,true);txt([45,45,45]);doc.text(t,mg+4.5,y);}
  function panel(x,y,w,h){doc.setFillColor(255,255,255);doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.35);doc.roundedRect(x,y,w,h,2,2,"FD");}
  function kpi(x,y,w,h,lb,val,sub,c){
    panel(x,y,w,h);fill(c);doc.rect(x,y,w,1.2,"F");
    font(6.8,true);txt(C.mut);doc.text(lb.toUpperCase(),x+3,y+6.5);
    font(12.5,true);txt(c);doc.text(val,x+3,y+13.5);
    if(sub){font(6.8);txt(C.mut);doc.text(sub,x+3,y+18);}
  }
  function chartImg(cfg,wmm,hmm){
    if(!cfg)return null;
    var cv=document.createElement("canvas");cv.width=Math.round(wmm*PX);cv.height=Math.round(hmm*PX);
    cv.style.position="fixed";cv.style.left="-99999px";document.body.appendChild(cv);
    var ch=new Chart(cv,cfg);var img=ch.toBase64Image();ch.destroy();cv.remove();
    return img;
  }
  function chartPanel(cfg,x,y,w,h,t,c,nota){
    panel(x,y,w,h);
    font(9,true);txt(c);doc.text(t,x+4,y+6.5);
    if(nota){font(7);txt(C.mut);doc.text(nota,x+w-4,y+6.5,{align:"right"});}
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x+4,y+8.8,x+w-4,y+8.8);
    var aw=w-8,ah=h-13;
    var img=chartImg(cfg,aw,ah);
    if(!img){font(8.5);txt([185,185,185]);doc.text("Sem dados no período",x+w/2,y+h/2,{align:"center"});return;}
    doc.addImage(img,"PNG",x+4,y+10.5,aw,ah);
  }
  // Tabela com quebra de pagina
  function table(y,cols,rows,opt){
    opt=opt||{};var rh=opt.rh||5.6,x=mg,tw=cols.reduce(function(a,c){return a+c.w;},0);
    function head(){
      fill(C.b);doc.rect(x,y,tw,rh+.6,"F");font(7.3,true);txt([255,255,255]);
      var cx=x;cols.forEach(function(c){doc.text(c.h,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.6,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});cx+=c.w;});
      y+=rh+.6;
    }
    head();
    rows.forEach(function(r,i){
      if(y+rh>H-14){doc.addPage();y=header();if(opt.titulo)section(opt.titulo+" (continuação)",y,opt.cor);y+=4;head();}
      if(r._total){fill([226,236,246]);doc.rect(x,y,tw,rh+.4,"F");}
      else if(r._hl){fill([227,240,250]);doc.rect(x,y,tw,rh,"F");}
      else if(i%2===1){fill([248,250,252]);doc.rect(x,y,tw,rh,"F");}
      var cx=x;
      cols.forEach(function(c){
        var v=r[c.k];v=v===undefined||v===null?"":String(v);
        var mw=c.w-3;
        font(7.2,r._total||r._hl||c.b);
        while(v.length>3&&doc.getTextWidth(v)>mw)v=v.slice(0,-2);
        var cor=c.cor?c.cor(r):C.txt;txt(r._total&&!c.cor?C.b:cor);
        doc.text(v,c.al==="r"?cx+c.w-2:c.al==="c"?cx+c.w/2:cx+2,y+rh/2+1.5,{align:c.al==="r"?"right":c.al==="c"?"center":"left"});
        cx+=c.w;
      });
      y+=r._total?rh+.4:rh;
    });
    doc.setDrawColor(C.line[0],C.line[1],C.line[2]);doc.setLineWidth(.25);doc.line(x,y,x+tw,y);
    return y;
  }

  var P=st.P,A=st.acum;
  // ===== PAGINA 1 =====
  var y=header();
  section("Indicadores - "+st.per,y);y+=3.5;
  var ks=[
    ["Prêmio previsto",fmtBRL(P.pot),st.per,C.b],
    ["Total pago",fmtBRL(P.pago),P.linhas.length+" colaboradores",C.grn],
    ["Total perdido",fmtBRL(P.perd),pct1(P.pctPerda)+" do previsto",C.red],
    ["% de ganho",pct1(P.pctGanho),P.ok+" com 100% do prêmio",C.grn],
    ["Perda com faltas",fmtBRL(P.lf),P.nf+" faltas",C.red],
    ["Absenteísmo",pct1(P.abs),P.absF+" faltas no período",C.org]
  ];
  var gap=3.2,kw=(cw-gap*5)/6,kh=21;
  ks.forEach(function(k,i){kpi(mg+i*(kw+gap),y,kw,kh,k[0],k[1],k[2],k[3]);});
  y+=kh+8;
  section("Evolução mês a mês - "+st.selAno,y);y+=3.5;
  var chH=(H-12-y-4)/2;
  chartPanel(st.anoD.length?relCfgGP(st.labels,st.anoD,1.9,st.selIdx):null,mg,y,cw,chH,"Ganho x Perda mês a mês (R$) e % de ganho",C.grn,"Acumulado: pago "+fmtBRL(A.pago)+"  |  perdido "+fmtBRL(A.perd)+"  |  ganho "+pct1(A.pctGanho));
  y+=chH+3;
  chartPanel(st.anoD.length?relCfgPerdas(st.labels,st.anoD,1.9,st.selIdx):null,mg,y,cw,chH,"Perdas com faltas, atrasos e 5S (R$) e absenteísmo",C.red,"Acumulado: perda com faltas "+fmtBRL(A.lf)+"  |  absenteísmo "+pct1(A.abs));

  // ===== PAGINA 2 =====
  doc.addPage();y=header();
  section("Composição das perdas e colaboradores - "+st.per,y,C.red);y+=3.5;
  var pH=66,lw=cw*0.36;
  chartPanel(relCfgComp(P,1.6),mg,y,lw,pH,"Composição das perdas",C.red);
  chartPanel(relCfgColab(P,1.35,10),mg+lw+gap,y,cw-lw-gap,pH,"Maiores perdas por colaborador",C.red,"R$ perdido  ·  % do prêmio");
  y+=pH+8;
  section("Resumo mês a mês - "+st.selAno,y);y+=3;
  var gC=function(){return C.grn;},rC=function(){return C.red;},oC=function(){return C.org;};
  var colsR=[
    {h:"Mês",k:"mes",w:30,b:true,cor:function(){return C.b;}},{h:"Previsto",k:"pot",w:26,al:"r"},{h:"Pago",k:"pago",w:26,al:"r",cor:gC},
    {h:"Perdido",k:"perd",w:26,al:"r",cor:rC},{h:"% Ganho",k:"pg",w:19,al:"r",cor:gC},{h:"% Perda",k:"pp",w:19,al:"r",cor:rC},
    {h:"Perda faltas",k:"lf",w:25,al:"r",cor:rC},{h:"Perda atrasos",k:"la",w:25,al:"r"},{h:"Perda 5S",k:"ls",w:21,al:"r"},
    {h:"Faltas",k:"nf",w:13,al:"c"},{h:"Atrasos",k:"na",w:14,al:"c"}
  ];
  colsR.push({h:"Absenteísmo",k:"abs",w:cw-colsR.reduce(function(a,c){return a+c.w;},0),al:"r",cor:oC});
  function rowR(d,lb){return{mes:lb,pot:fmtBRL(d.pot),pago:fmtBRL(d.pago),perd:fmtBRL(d.perd),pg:pct1(d.pctGanho),pp:pct1(d.pctPerda),lf:fmtBRL(d.lf),la:fmtBRL(d.la),ls:fmtBRL(d.ls),nf:d.nf,na:d.na,abs:pct1(d.abs)};}
  var rowsR=st.anoD.map(function(d,i){var r=rowR(d,fmtM(d.m));r._hl=i===st.selIdx;return r;});
  var tr=rowR(A,"Acumulado "+st.selAno);tr._total=true;rowsR.push(tr);
  table(y,colsR,rowsR,{rh:5.3,titulo:"Resumo mês a mês - "+st.selAno});

  // ===== PAGINA 3+ : colaboradores =====
  doc.addPage();y=header();
  section("Pagamento Cartão Benefício por colaborador - "+st.per,y);y+=3;

var MOSF=["Janeiro","Fevereiro","Marco","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];

// Eventos (tempo de empresa + aniversario de vida) de um mes/ano
function anivDoMes(ano,mesIdx){
  var mm=String(mesIdx+1).padStart(2,"0"),emp=[],vida=[];
  DB.emp.filter(ativoVis).forEach(function(e){
    if(e.adm&&e.adm.slice(5,7)===mm){
      var a=ano-parseInt(e.adm.slice(0,4),10);
      if(a>=1)emp.push({e:e,dia:parseInt(e.adm.slice(8,10),10),anos:a,data:e.adm});
    }
    if(e.aniv&&e.aniv.slice(5,7)===mm){
      vida.push({e:e,dia:parseInt(e.aniv.slice(8,10),10),anos:ano-parseInt(e.aniv.slice(0,4),10),data:e.aniv});
    }
  });
  var ord=function(a,b){return a.dia-b.dia||a.e.nome.localeCompare(b.e.nome);};
  emp.sort(ord);vida.sort(ord);
  return {empresa:emp,vida:vida};
}

// ── TELA DE PARABENS (Task 2) ──
function checkAniversarios(){
  var hj=hoje(),mm=mmdd(hj),ano=parseInt(hj.slice(0,4),10),evs=[];
  DB.emp.filter(ativoVis).forEach(function(e){
    if(e.adm&&mmdd(e.adm)===mm){var a=ano-parseInt(e.adm.slice(0,4),10);if(a>=1)evs.push({e:e,tipo:"empresa",anos:a});}
    if(e.aniv&&mmdd(e.aniv)===mm){evs.push({e:e,tipo:"vida",anos:ano-parseInt(e.aniv.slice(0,4),10)});}
  });
  if(!evs.length)return;
  evs.sort(function(a,b){return a.e.nome.localeCompare(b.e.nome);});
  var temEmp=evs.some(function(x){return x.tipo==="empresa";}),temVida=evs.some(function(x){return x.tipo==="vida";});
  var subt=temEmp&&temVida?"Aniversario de vida e de tempo de empresa hoje":temVida?"Aniversario de vida hoje":"Aniversario de tempo de empresa hoje";
  var rows=evs.map(function(x){
    var tag=x.tipo==="empresa"

      +"<div class='aniv-fn'>"+esc(x.e.func)+"</div>"+tag+"</div></div>";
  }).join("");
  closeAniv();
  var div=document.createElement("div");div.className="aniv-bg";div.id="md-aniv";
  div.innerHTML="<div class='aniv-card' role='dialog' aria-modal='true'>"
    +"<div class='aniv-hd'><div class='ic'><i class='ti ti-confetti'></i></div>"
    +"<h2>Parabens!</h2><p>"+subt+"</p></div>"
    +"<div class='aniv-bd'>"+rows+"</div>"
    +"<div class='aniv-ft'><button onclick='closeAniv()'><i class='ti ti-check' style='margin-right:5px'></i>Fechar</button></div>"
    +"</div>";
  document.body.appendChild(div);
}

// ── CALENDARIO DE ANIVERSARIOS (Task 3) ──
function rCal(){
  var now=new Date();
  var selAno=parseInt(gv("cal-ano"),10);if(isNaN(selAno))selAno=now.getFullYear();
  var selMes=gv("cal-mes");selMes=selMes===""?now.getMonth():parseInt(selMes,10);
  if(isNaN(selMes))selMes=now.getMonth();

  var anoAtual=now.getFullYear(),anos=[];
  for(var y=anoAtual-3;y<=anoAtual+2;y++)anos.push(y);
  var anoOpts=anos.map(function(a){return "<option value='"+a+"'"+(a===selAno?" selected":"")+">"+a+"</option>";}).join("");
  var mesOpts=MOSF.map(function(m,i){return "<option value='"+i+"'"+(i===selMes?" selected":"")+">"+m+"</option>";}).join("");

  var ev=anivDoMes(selAno,selMes);
  var porDia={};
  ev.empresa.forEach(function(x){(porDia[x.dia]=porDia[x.dia]||[]).push({t:"emp",x:x});});
  ev.vida.forEach(function(x){(porDia[x.dia]=porDia[x.dia]||[]).push({t:"vida",x:x});});

  var primeiro=new Date(selAno,selMes,1).getDay();
  var diasNoMes=new Date(selAno,selMes+1,0).getDate();
  var hj=hoje(),mmHj=String(selMes+1).padStart(2,"0"),ehMesAtual=(selAno===now.getFullYear());

  var wd=["Dom","Seg","Ter","Qua","Qui","Sex","Sab"];
  var grid="<div class='cal-grid'>"+wd.map(function(d){return "<div class='cal-wd'>"+d+"</div>";}).join("");
  for(var i=0;i<primeiro;i++)grid+="<div class='cal-cell empty'></div>";
  for(var d=1;d<=diasNoMes;d++){
    var dd=String(d).padStart(2,"0");
    var ehHoje=ehMesAtual&&(selAno+"-"+mmHj+"-"+dd)===hj;
    var evs=porDia[d]||[];
    var pills=evs.map(function(o){
      var nome=nome1(o.x.e);
      if(o.t==="emp")return "<div class='cal-ev emp' title='"+esc(o.x.e.nome)+" - "+o.x.anos+" anos de empresa'><i class='ti ti-building'></i>"+esc(nome)+" ("+o.x.anos+"a)</div>";
      return "<div class='cal-ev vida' title='"+esc(o.x.e.nome)+" - "+o.x.anos+" anos'><i class='ti ti-cake'></i>"+esc(nome)+" ("+o.x.anos+")</div>";
    }).join("");
    grid+="<div class='cal-cell"+(ehHoje?" today":"")+"'><span class='cal-dn'>"+d+"</span>"+pills+"</div>";
  }
  grid+="</div>";

  var selSt="padding:.4rem .75rem;border:1.5px solid #e3dfdf;border-radius:8px;font-size:13px;color:"+B+";font-weight:700;background:#fff";
  var totalEmp=ev.empresa.length,totalVida=ev.vida.length;

  document.getElementById("p-calendario").innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Aniversarios</h1>"
    +"<div class='sub'>Tempo de empresa e aniversario de vida &middot; "+MOSF[selMes]+"/"+selAno+"</div></div>"
    +"<button class='btnp btn-ic' onclick='gerarAniversariantesPDF()'"+((totalEmp+totalVida)?"":" disabled")+"><i class='ti ti-printer'></i>Imprimir aniversariantes do mes</button></div>"
    +"<div class='card' style='margin-bottom:1rem'>"
    +"<div style='display:flex;gap:12px;flex-wrap:wrap;align-items:center'>"
    +"<div style='display:flex;align-items:center;gap:8px'><i class='ti ti-calendar' style='color:#888;font-size:16px'></i>"
    +"<span style='font-size:12px;font-weight:600;color:#555'>Mes:</span><select id='cal-mes' onchange='rCal()' style='"+selSt+"'>"+mesOpts+"</select></div>"
    +"<div style='display:flex;align-items:center;gap:8px'><span style='font-size:12px;font-weight:600;color:#555'>Ano:</span><select id='cal-ano' onchange='rCal()' style='"+selSt+"'>"+anoOpts+"</select></div>"
    +"<div style='display:flex;gap:16px;margin-left:auto;flex-wrap:wrap'>"
    +"<span class='cal-leg'><span class='cal-dot' style='background:#ED0010'></span>Tempo de empresa <b style='color:"+B+"'>("+totalEmp+")</b></span>"
    +"<span class='cal-leg'><span class='cal-dot' style='background:#1a7a4a'></span>Aniversario de vida <b style='color:"+GRN+"'>("+totalVida+")</b></span>"
    +"</div></div></div>"
    +"<div class='card'>"+grid+"</div>";
}

// BACKUP AUTOMATICO
// Copias ficam no proprio Supabase (tabela fermar_dados, linhas bkp_*),
// 1 automatica por dia no primeiro acesso, guardando as ultimas BKP_MAX.
// ═══════════════════════════════════════
var BKP_MAX=30,BKP_LISTA=null,BKP_ERRO="";
function bkpDocs(){return _db.collection("fermar");}
function bkpNovoId(){
  var d=new Date(),z=function(n){return String(n).padStart(2,"0");};
  return d.getFullYear()+z(d.getMonth()+1)+z(d.getDate())+"_"+z(d.getHours())+z(d.getMinutes())+z(d.getSeconds());
}
function bkpDataId(id){return id.slice(6,8)+"/"+id.slice(4,6)+"/"+id.slice(0,4)+" "+id.slice(9,11)+":"+id.slice(11,13);}
function bkpTam(n){return n>=1048576?(n/1048576).toLocaleString("pt-BR",{maximumFractionDigits:1})+" MB":Math.max(1,Math.round(n/1024))+" KB";}
function bkpListar(){
  return bkpDocs().doc("_backups").get().then(function(s){BKP_LISTA=s.exists?(s.data().lista||[]):[];return BKP_LISTA;});
}
function bkpCriar(tipo){
  if(!window._dbLoaded)return Promise.reject(new Error("Os dados ainda nao foram carregados."));
  var id=bkpNovoId(),snap=JSON.parse(JSON.stringify(DB)),cont={};
  COLECOES.forEach(function(c){cont[c]=(snap[c]||[]).length;});
  var meta={id:id,criado:new Date().toISOString(),tipo:tipo,cont:cont,tam:JSON.stringify(snap).length};
  return Promise.all(COLECOES.map(function(c){
    return bkpDocs().doc("bkp_"+id+"_"+c).set({dados:snap[c]||[],criado:meta.criado});
  })).then(bkpListar).then(function(lista){
    lista=lista.filter(function(x){return x.id!==id;});
    lista.unshift(meta);
    var sobra=lista.slice(BKP_MAX);lista=lista.slice(0,BKP_MAX);
    return bkpDocs().doc("_backups").set({lista:lista,atualizado:meta.criado}).then(function(){
      BKP_LISTA=lista;
      return Promise.all(sobra.map(function(r){return bkpApagarDocs(r.id);}));
    });
  }).then(function(){return meta;});
}
function bkpApagarDocs(id){
  return Promise.all(COLECOES.map(function(c){return bkpDocs().doc("bkp_"+id+"_"+c).delete().catch(function(){});}));
}
function bkpLer(id){
  return Promise.all(COLECOES.map(function(c){return bkpDocs().doc("bkp_"+id+"_"+c).get();})).then(function(snaps){
    var dados={};
    snaps.forEach(function(s,i){if(s.exists)dados[COLECOES[i]]=s.data().dados||[];});
    return dados;
  });
}
// Backup automatico: 1 por dia, no primeiro acesso
function autoBackup(){
  if(!window._dbLoaded)return;
  if(DB.emp.length===0&&DB.oc.length===0)return; // nunca guarda uma base vazia como backup
  var hojeId=bkpNovoId().slice(0,8);
  bkpListar().then(function(lista){
    if(lista.some(function(x){return x.tipo==="auto"&&x.id.slice(0,8)===hojeId;}))return null;
    return bkpCriar("auto").then(function(){BKP_ERRO="";});
  }).then(function(){
    bkpCopiaLocalSemanal();
    if(pg==="backup")rBkp();
  }).catch(function(e){
    BKP_ERRO=e.message||String(e);
    console.warn("Backup automatico falhou:",e);
  });
}
// Copia no computador (opcional, 1x por semana) - protege mesmo se a conta do Supabase tiver problema
function bkpLocalAtivo(){try{return localStorage.getItem("fermar_bkp_local")==="1";}catch(e){return false;}}
function bkpCopiaLocalSemanal(){
  if(!bkpLocalAtivo())return;
  var ult=0;try{ult=parseInt(localStorage.getItem("fermar_bkp_local_ult")||"0",10);}catch(e){}
  if(Date.now()-ult<7*24*3600*1000)return;
  bkpBaixarAtual();
  try{localStorage.setItem("fermar_bkp_local_ult",String(Date.now()));}catch(e){}
}
function setBkpLocal(on){try{localStorage.setItem("fermar_bkp_local",on?"1":"0");}catch(e){}rBkp();}
function bkpDownload(obj,nome){
  var blob=new Blob([JSON.stringify(obj)],{type:"application/json"});
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=nome;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},500);
}
function bkpPacote(dados,origem){return{sistema:"Fermar - Gestao de Premios",versao:1,origem:origem,gerado:new Date().toISOString(),colecoes:COLECOES,dados:dados};}
function bkpBaixarAtual(){
  if(!window._dbLoaded){alert("Os dados ainda nao foram carregados.");return;}
  bkpDownload(bkpPacote(DB,"dados atuais"),"backup-fermar-"+bkpNovoId()+".json");
}
function bkpBaixar(id){
  showSync("Preparando download...",false);
  bkpLer(id).then(function(d){
    bkpDownload(bkpPacote(d,"backup "+id),"backup-fermar-"+id+".json");
    showSync("Download iniciado",true);
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);
  }).catch(function(e){showSync("Erro: "+e.message,false,true);});
}
function bkpAgora(){
  showSync("Criando backup...",false);
  bkpCriar("manual").then(function(){
    showSync("Backup criado",true);BKP_ERRO="";
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},2500);rBkp();
  }).catch(function(e){BKP_ERRO=e.message;showSync("Erro no backup: "+e.message,false,true);rBkp();});
}
// Restaura: antes cria um backup de seguranca do estado atual
function bkpAplicar(dados,origem){
  var n=(dados.emp||[]).length,m=(dados.oc||[]).length;
  if(!confirm("Restaurar "+origem+"?\n\nColaboradores: "+n+"  |  Lancamentos: "+m+"\n\nOs dados atuais serao substituidos. Antes disso, um backup de seguranca do estado atual sera criado automaticamente."))return;
  showSync("Criando backup de seguranca...",false);
  bkpCriar("antes-restauracao").then(function(){
    COLECOES.forEach(function(c){if(Array.isArray(dados[c]))DB[c]=dados[c];});
    showSync("Restaurando...",false);
    return window._fbSave();
  }).then(function(){
    showSync("Backup restaurado com sucesso",true);
    setTimeout(function(){document.getElementById("sync-bar").style.display="none";},3000);
    rBkp();
  }).catch(function(e){showSync("Erro ao restaurar: "+e.message,false,true);});
}
function bkpRestaurar(id){
  showSync("Lendo backup...",false);
  bkpLer(id).then(function(d){
    document.getElementById("sync-bar").style.display="none";
    if(!d.emp){alert("Backup incompleto ou nao encontrado.");return;}
    bkpAplicar(d,"o backup de "+bkpDataId(id));
  }).catch(function(e){showSync("Erro: "+e.message,false,true);});
}
function bkpExcluir(id){
  if(!confirm("Excluir o backup de "+bkpDataId(id)+"?"))return;
  bkpListar().then(function(lista){
    lista=lista.filter(function(x){return x.id!==id;});
    return bkpDocs().doc("_backups").set({lista:lista,atualizado:new Date().toISOString()}).then(function(){BKP_LISTA=lista;return bkpApagarDocs(id);});
  }).then(rBkp).catch(function(e){showSync("Erro: "+e.message,false,true);});
}
function bkpImportar(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    inp.value="";
    try{
      var o=JSON.parse(r.result),d=o&&o.dados;
      if(!d||!Array.isArray(d.emp))throw new Error("Arquivo nao e um backup valido do sistema.");
      bkpAplicar(d,"o arquivo "+f.name+(o.gerado?" (gerado em "+new Date(o.gerado).toLocaleString("pt-BR")+")":""));
    }catch(e){alert("Nao foi possivel ler o arquivo: "+e.message);}
  };
  r.readAsText(f);
}

function rBkp(){
  var el=document.getElementById("p-backup");if(!el)return;
  var lista=BKP_LISTA;
  var ultAuto=lista?lista.find(function(x){return x.tipo==="auto";}):null;
  var tipoLb={auto:["AUTOMATICO","bdg-ok"],manual:["MANUAL","bdg-off"],"antes-restauracao":["ANTES DE RESTAURAR","bdg-dem"]};
  var rows=lista===null?"<div class='empty'><i class='ti ti-loader'></i>Carregando backups...</div>":
    lista.length===0?"<div class='empty'><i class='ti ti-database-off'></i>Nenhum backup ainda. O primeiro sera criado automaticamente hoje, ou clique em Fazer backup agora.</div>":
    "<div style='overflow-x:auto'><table style='min-width:760px'><thead><tr style='background:"+B+";color:#fff'>"
    +"<th>Data e hora</th><th>Tipo</th><th style='text-align:center'>Colaboradores</th><th style='text-align:center'>Lancamentos</th><th style='text-align:center'>Infracoes 5S</th><th style='text-align:right'>Tamanho</th><th style='text-align:right'>Acoes</th></tr></thead><tbody>"
    +lista.map(function(x){
      var tl=tipoLb[x.tipo]||[x.tipo,"bdg-off"],c=x.cont||{};
      return "<tr><td style='font-weight:700;color:"+B+"'>"+bkpDataId(x.id)+"</td>"
        +"<td><span class='bdg "+tl[1]+"'>"+tl[0]+"</span></td>"
        +"<td style='text-align:center'>"+(c.emp||0)+"</td><td style='text-align:center'>"+(c.oc||0)+"</td><td style='text-align:center'>"+(c.oc5||0)+"</td>"
        +"<td style='text-align:right;color:#888'>"+bkpTam(x.tam||0)+"</td>"
        +"<td style='text-align:right;white-space:nowrap'>"
        +"<button class='ibedt' title='Baixar (.json)' onclick=\"bkpBaixar('"+x.id+"')\"><i class='ti ti-download'></i></button>"
        +"<button class='btng btn-ic' style='padding:.3rem .65rem;margin:0 4px' onclick=\"bkpRestaurar('"+x.id+"')\"><i class='ti ti-restore'></i>Restaurar</button>"
        +"<button class='ibdel' title='Excluir' onclick=\"bkpExcluir('"+x.id+"')\"><i class='ti ti-trash'></i></button></td></tr>";
    }).join("")+"</tbody></table></div>";
  var local=bkpLocalAtivo();
  el.innerHTML=
    "<div class='pg-hd'><div><h1 class='h1'>Backup dos dados</h1><div class='sub'>Copias automaticas diarias com restauracao</div></div>"
    +"<div style='display:flex;gap:8px;flex-wrap:wrap'>"
    +"<button class='btng btn-ic' onclick='bkpBaixarAtual()'><i class='ti ti-download'></i>Baixar dados atuais (.json)</button>"
    +"<label class='btng btn-ic' style='cursor:pointer'><i class='ti ti-upload'></i>Restaurar de arquivo<input type='file' accept='.json,application/json' onchange='bkpImportar(this)' style='display:none'/></label>"
    +"<button class='btnp btn-ic' onclick='bkpAgora()'><i class='ti ti-database-plus'></i>Fazer backup agora</button></div></div>"
    +(BKP_ERRO?"<div class='warn' style='margin-bottom:1rem;background:#fbe9e7;color:#a93226'><i class='ti ti-alert-triangle'></i> Ultimo backup automatico falhou: "+esc(BKP_ERRO)+". Verifique a conexao e as regras de seguranca (RLS) do Supabase.</div>":"")
    +"<div class='ga' style='margin-bottom:1rem'>"
    +sCard("Ultimo backup automatico",ultAuto?bkpDataId(ultAuto.id):"—",GRN,"ti-clock-check",ultAuto?"criado no primeiro acesso do dia":"ainda nao criado")
    +sCard("Backups guardados",(lista?lista.length:0)+" / "+BKP_MAX,B,"ti-database","os mais antigos sao apagados")
    +sCard("Copia no computador",local?"Ativada":"Desativada",local?GRN:"#6b7580","ti-device-desktop","1x por semana (.json)")
    +"</div>"
    +"<div class='card' style='margin-bottom:1rem'>"
    +"<div style='display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap'>"
    +"<div style='font-size:13px;color:#555;line-height:1.6;max-width:760px'>"
    +"<b style='color:"+B+"'>Como funciona:</b> no primeiro acesso de cada dia, o sistema guarda uma copia completa dos dados no Supabase e mantem as "+BKP_MAX+" mais recentes. "
    +"Ao restaurar, uma copia do estado atual e criada antes, para poder desfazer. "
    +"A copia semanal no computador baixa um arquivo .json para a pasta Downloads deste computador.</div>"
    +"<div class='seg'><button class='seg-b"+(local?" on":"")+"' onclick='setBkpLocal(true)'>Copia semanal ligada</button><button class='seg-b"+(local?"":" on")+"' onclick='setBkpLocal(false)'>Desligada</button></div>"
    +"</div></div>"
    +"<div class='card'><div style='font-weight:700;font-size:15px;color:"+B+";margin-bottom:.75rem'>Backups guardados</div>"+rows+"</div>";
  if(lista===null)bkpListar().then(rBkp).catch(function(e){BKP_ERRO=e.message;BKP_LISTA=[];rBkp();});
}

</script>
</body>
</html>
